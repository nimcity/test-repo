<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Puzzle Fighter</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; height:100dvh; overflow:hidden; background:#000; touch-action:none; user-select:none; }
canvas { display:block; width:100vw; height:100dvh; }
#controls {
  display:none;
  position:fixed; bottom:0; left:0; right:0;
  height:148px;
  flex-direction:column;
  background:transparent;
  z-index:10;
}
#controls.visible { display:flex; }
#ctrl-zones {
  flex:1;
  display:flex;
  flex-direction:row;
}
.ctrl-zone {
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  touch-action:none;
  -webkit-tap-highlight-color:transparent;
  cursor:pointer;
  position:relative;
}
#zone-left { border-right:1px solid rgba(255,255,255,0.06); }
#zone-right { border-left:1px solid rgba(255,255,255,0.06); }
.zone-arrow {
  font-size:28px;
  color:rgba(255,255,255,0.22);
  pointer-events:none;
  transition:color 0.08s;
}
.zone-label {
  font-size:11px;
  color:rgba(255,255,255,0.18);
  text-align:center;
  line-height:1.4;
  pointer-events:none;
  font-family:Arial,sans-serif;
  letter-spacing:0.04em;
}
.ctrl-zone.active .zone-arrow { color:rgba(255,255,255,0.8); }
.ctrl-zone.active .zone-label { color:rgba(255,255,255,0.6); }
#ctrl-btns {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  height:50px;
  padding:0 14px 8px;
}
.btn {
  height:40px;
  background:rgba(255,255,255,0.10);
  border:1.5px solid rgba(255,255,255,0.28);
  border-radius:10px;
  color:#fff;
  font-size:14px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
  padding:0 14px;
}
.btn:active { background:rgba(255,255,255,0.28); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="controls">
  <div id="ctrl-zones">
    <div id="zone-left" class="ctrl-zone">
      <div class="zone-arrow">◀</div>
    </div>
    <div id="zone-mid" class="ctrl-zone">
      <div class="zone-label">TAP<br>ROTATE</div>
    </div>
    <div id="zone-right" class="ctrl-zone">
      <div class="zone-arrow">▶</div>
    </div>
  </div>
  <div id="ctrl-btns">
    <div class="btn" id="btn-super" style="font-weight:900;opacity:0.35;background:rgba(255,200,0,0.1);border-color:rgba(255,200,0,0.3);color:#ffdd00;font-size:13px;min-width:80px;">★ SUPER</div>
    <div class="btn" id="btn-drop" style="font-size:16px;min-width:60px;">▼ DROP</div>
    <div class="btn" id="btn-pause" style="font-size:18px;min-width:52px;">⏸</div>
  </div>
</div>
<script>
'use strict';
// ============================================================
// CONSTANTS & STATE
// ============================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const S = { TITLE:0, CHARSEL:1, DIFF:2, VS:3, GAME:4, RESULT:5, ARCADE:6, ARCADE_END:7 };
let state = S.TITLE;

let CELL=28, BW=168, BH=336, LX=20, RX=210, BY=40;
const COLS=6, ROWS=12;

const TN=0, TC=1, TK=2, TP=3;

const PAL = {
  red:   ['#ff7070','#cc0000','#6b0000','#ff2244'],  // ruby: bright highlight, deep crimson, dark core, vivid accent
  blue:  ['#99ccff','#1144cc','#001466','#3399ff'],  // sapphire: ice highlight, royal blue, midnight core, sky accent
  yellow:['#ffe066','#cc8800','#5a3a00','#ffcc00'],  // topaz/amber: warm highlight, rich amber, dark gold core, bright accent
  green: ['#66ee88','#118833','#003316','#22dd55'],  // emerald: bright highlight, vivid emerald, deep forest core, lime accent
  gray:  ['#e0e0e0','#8a8a8a','#3a3a3a','#bbbbbb'],  // stone: light highlight, mid gray, dark core, silver accent
};
const CHAR_COLORS = ['red','blue','yellow','green'];
const CHAR_NAMES  = ['KAI','MEI','RIKU','SHADOW'];

let playerChar = 0, cpuChar = 1;
let vsTimer = 0;
let winner = 0;
let difficulty = 1; // 0=easy, 1=medium, 2=hard

// Arcade ladder mode
let arcadeMode = false;
let arcadeRound = 0;
let arcadeOpponents = [];
let arcadeRoundTimer = 0;
let arcadeScoreTotal = 0;
const ARCADE_DIFF = [0, 0, 1, 2];

// Survival mode
let survivalMode = false;
let survivalTime = 0;
let survivalGems = 0;
let survivalScore = 0;
let lastGameWasSurvival = false;

const DIFF_SETTINGS = [
  { name:'EASY',   gravity:1400, aiSpeed:600,  aiError:0.40, attackMult:0.5, lockDelay:500, label:'★☆☆', color:'#44cc44' },
  { name:'MEDIUM', gravity:750,  aiSpeed:250,  aiError:0.0,  attackMult:1.0, lockDelay:300, label:'★★☆', color:'#ffcc00' },
  { name:'HARD',   gravity:400,  aiSpeed:120,  aiError:0.0,  attackMult:1.5, lockDelay:150, label:'★★★', color:'#ff4444' },
];

let soundOn = true;

// ============================================================
// AUDIO ENGINE
// ============================================================
let audioCtx = null, masterGain = null, musicTrackId = null, musicTimeout = null;

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.4;
    masterGain.connect(audioCtx.destination);
  } catch(e) { audioCtx = null; }
}

function _note(hz, startTime, duration, type, vol) {
  if (!audioCtx || hz <= 0) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(hz, startTime);
  g.gain.setValueAtTime(vol || 0.3, startTime);
  g.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(g); g.connect(masterGain);
  osc.start(startTime); osc.stop(startTime + duration + 0.01);
}

function _kick(t) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.frequency.setValueAtTime(100, t);
  osc.frequency.exponentialRampToValueAtTime(30, t + 0.1);
  g.gain.setValueAtTime(0.7, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  osc.connect(g); g.connect(masterGain);
  osc.start(t); osc.stop(t + 0.2);
}

function _snare(t) {
  if (!audioCtx) return;
  const bufSize = audioCtx.sampleRate * 0.1;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i=0; i<bufSize; i++) data[i] = Math.random()*2-1;
  const src = audioCtx.createBufferSource();
  const hpf = audioCtx.createBiquadFilter();
  const g = audioCtx.createGain();
  src.buffer = buf;
  hpf.type = 'highpass'; hpf.frequency.value = 1500;
  g.gain.setValueAtTime(0.4, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  src.connect(hpf); hpf.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t + 0.15);
}

const N = {
  _:0,
  C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196.00,A3:220.00,B3:246.94,
  C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,B4:493.88,
  C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880.00,B5:987.77
};

function scheduleTrack(trackId, startTime) {
  if (!audioCtx) return 0;
  let dur = 0;
  if (trackId === 'title') {
    const b = 60/120;
    const mel = [
      N.G4,b, N.G4,b/2, N.A4,b/2, N.B4,b, N.C5,b,
      N.D5,b, N.C5,b/2, N.B4,b/2, N.A4,2*b,
      N.G4,b, N.B4,b/2, N.D5,b/2, N.G5,b, N.E5,b,
      N.D5,b, N.C5,b/2, N.B4,b/2, N.A4,2*b,
      N.A4,b, N.A4,b/2, N.B4,b/2, N.C5,b, N.D5,b,
      N.E5,b, N.D5,b/2, N.C5,b/2, N.B4,2*b,
      N.G4,b, N.C5,b, N.B4,b, N.A4,b, N.G4,4*b
    ];
    let t = startTime;
    for (let i=0;i<mel.length;i+=2) { _note(mel[i],t,mel[i+1]*0.88,'square',0.18); t+=mel[i+1]; }
    dur = t - startTime;
    const bass = [N.G3,4*b,N.C4,4*b,N.D4,4*b,N.G3,4*b, N.G3,4*b,N.C4,4*b,N.D4,4*b,N.G3,4*b];
    let bt = startTime;
    for (let i=0;i<bass.length;i+=2) { _note(bass[i],bt,bass[i+1]*0.84,'triangle',0.22); bt+=bass[i+1]; }
    let dt = startTime;
    while (dt < startTime+dur) { _kick(dt); _kick(dt+2*b); _snare(dt+b); _snare(dt+3*b); dt+=4*b; }
  } else if (trackId === 'battle') {
    const b = 60/155;
    const mel = [
      N.A4,b/2,N.A4,b/2,N.C5,b/2,N.A4,b/2,N.G4,b,N.E4,b,
      N.A4,b/2,N.G4,b/2,N.E4,b/2,N.D4,b/2,N.E4,2*b,
      N.A4,b/2,N.A4,b/2,N.C5,b/2,N.D5,b/2,N.E5,b,N.C5,b,
      N.A4,b/2,N.G4,b/2,N.A4,b/2,N.E4,b/2,N.A4,2*b,
      N.G4,b/2,N.G4,b/2,N.A4,b/2,N.G4,b/2,N.E4,b,N.C4,b,
      N.D4,b/2,N.E4,b/2,N.G4,b/2,N.A4,b/2,N.G4,2*b,
      N.A4,b,N.E5,b/2,N.D5,b/2,N.C5,b/2,N.A4,b/2,N.G4,b,
      N.E4,b/2,N.G4,b/2,N.A4,3*b
    ];
    let t = startTime;
    for (let i=0;i<mel.length;i+=2) { _note(mel[i],t,mel[i+1]*0.82,'square',0.14); t+=mel[i+1]; }
    dur = t - startTime;
    const bass = [
      N.A3,b/2,N.A3,b/2,N.G3,b/2,N.A3,b/2, N.E3,b/2,N.E3,b/2,N.G3,b/2,N.A3,b/2,
      N.A3,b/2,N.A3,b/2,N.C4,b/2,N.A3,b/2, N.G3,b/2,N.G3,b/2,N.E3,b/2,N.G3,b/2,
      N.A3,b/2,N.A3,b/2,N.G3,b/2,N.A3,b/2, N.E3,b/2,N.E3,b/2,N.G3,b/2,N.A3,b/2,
      N.C3,b/2,N.C3,b/2,N.E3,b/2,N.G3,b/2, N.A3,4*b
    ];
    let bt = startTime;
    for (let i=0;i<bass.length;i+=2) { _note(bass[i],bt,bass[i+1]*0.78,'sawtooth',0.17); bt+=bass[i+1]; }
    let dt = startTime;
    while (dt < startTime+dur) { _kick(dt);_kick(dt+b);_kick(dt+2*b);_kick(dt+3*b); _snare(dt+b);_snare(dt+3*b); dt+=4*b; }
  }
  return dur;
}

function play(trackId) {
  if (!audioCtx || !soundOn) return;
  if (musicTimeout) { clearTimeout(musicTimeout); musicTimeout=null; }
  musicTrackId = trackId;
  function loop() {
    if (musicTrackId !== trackId) return;
    const t = audioCtx.currentTime + 0.05;
    const dur = scheduleTrack(trackId, t);
    if (dur > 0) musicTimeout = setTimeout(loop, (dur-0.12)*1000);
  }
  loop();
}

function stopMusic() {
  musicTrackId = null;
  if (musicTimeout) { clearTimeout(musicTimeout); musicTimeout=null; }
}

function vibrate(pattern) { try { navigator.vibrate && navigator.vibrate(pattern); } catch(e){} }

function sfx(name) {
  if (!audioCtx || !soundOn) return;
  const t = audioCtx.currentTime;
  if (name==='place') {
    _note(180, t, 0.12, 'square', 0.25);
  } else if (name==='allclear') {
    [523,659,784,1047,1319].forEach((hz,i)=>_note(hz,t+i*0.12,0.18,'square',0.3));
  } else if (name==='crash') {
    const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
    osc.type='sawtooth';
    osc.frequency.setValueAtTime(400,t);
    osc.frequency.exponentialRampToValueAtTime(50,t+0.3);
    g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
    osc.connect(g); g.connect(masterGain); osc.start(t); osc.stop(t+0.35);
  } else if (name==='chain') {
    [660,880,1100].forEach((hz,i)=>_note(hz,t+i*0.1,0.15,'square',0.22));
  } else if (name==='power') {
    _note(523,t,0.2,'square',0.2); _note(659,t+0.05,0.2,'square',0.2);
  } else if (name==='attack') {
    const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
    osc.type='sawtooth';
    osc.frequency.setValueAtTime(880,t); osc.frequency.exponentialRampToValueAtTime(220,t+0.25);
    g.gain.setValueAtTime(0.4,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.25);
    osc.connect(g); g.connect(masterGain); osc.start(t); osc.stop(t+0.3);
  } else if (name==='win') {
    [523,659,784,1047].forEach((hz,i)=>_note(hz,t+i*0.18,0.3,'square',0.25));
  } else if (name==='lose') {
    [523,440,349,262].forEach((hz,i)=>_note(hz,t+i*0.18,0.35,'triangle',0.22));
  }
}

// ============================================================
// PARTICLES
// ============================================================
const stars=[], bgGems=[];

function initParticles() {
  stars.length=0; bgGems.length=0;
  for (let i=0;i<50;i++) {
    stars.push({ x:Math.random()*canvas.width, y:Math.random()*canvas.height,
      r:Math.random()*2+0.5, speed:Math.random()*0.3+0.1, twinkle:Math.random()*Math.PI*2 });
  }
  const gc=['#ff4444','#4477ff','#ffcc00','#33dd33','#cc44ff'];
  for (let i=0;i<20;i++) {
    bgGems.push({ x:Math.random()*canvas.width, y:Math.random()*canvas.height-canvas.height,
      size:Math.random()*16+8, speed:Math.random()*0.4+0.15,
      color:gc[Math.floor(Math.random()*gc.length)],
      rot:Math.random()*Math.PI, rotSpeed:(Math.random()-0.5)*0.02 });
  }
}

function updateParticles(dt) {
  for (const s of stars) s.twinkle += dt*2;
  for (const g of bgGems) {
    g.y += g.speed*dt*60; g.rot += g.rotSpeed;
    if (g.y > canvas.height+30) { g.y=-30; g.x=Math.random()*canvas.width; }
  }
}

function drawStars() {
  for (const s of stars) {
    const a=0.4+0.6*(0.5+0.5*Math.sin(s.twinkle));
    ctx.fillStyle=`rgba(255,255,255,${a})`;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
}

function drawBgGems() {
  for (const g of bgGems) {
    ctx.save(); ctx.translate(g.x,g.y); ctx.rotate(g.rot); ctx.globalAlpha=0.28;
    ctx.fillStyle=g.color;
    const s=g.size;
    ctx.beginPath(); ctx.moveTo(0,-s); ctx.lineTo(s*0.6,0); ctx.lineTo(0,s); ctx.lineTo(-s*0.6,0); ctx.closePath(); ctx.fill();
    ctx.globalAlpha=1; ctx.restore();
  }
}

// ============================================================
// CHARACTER DRAWING
// ============================================================

// Anime eye drawing helper
function drawAnimeEye(ex, ey, ew, eh, irisColor, mood) {
  // 1. White sclera
  ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.ellipse(ex,ey,ew,eh,0,0,Math.PI*2); ctx.fill();
  // 2. Iris
  const ir=ew*0.72;
  ctx.fillStyle=irisColor;
  ctx.beginPath(); ctx.ellipse(ex,ey+eh*0.06,ir,ir,0,0,Math.PI*2); ctx.fill();
  // 3. Dark shadow top of iris
  const sg=ctx.createLinearGradient(ex,ey-ir,ex,ey+ir*0.3);
  sg.addColorStop(0,'rgba(0,0,0,0.55)'); sg.addColorStop(0.5,'rgba(0,0,0,0.12)'); sg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.ellipse(ex,ey+eh*0.06,ir,ir,0,0,Math.PI*2); ctx.fill();
  // 4. Pupil
  ctx.fillStyle='#0a0a0a'; ctx.beginPath(); ctx.arc(ex,ey+ir*0.22,ir*0.42,0,Math.PI*2); ctx.fill();
  // 5. Glowing effect for Shadow
  if (mood==='glowing') {
    ctx.shadowColor='#ff2200'; ctx.shadowBlur=10;
    ctx.fillStyle='rgba(255,50,0,0.45)';
    ctx.beginPath(); ctx.ellipse(ex,ey+eh*0.06,ir,ir,0,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }
  // 6. Thick upper eyelid
  ctx.strokeStyle='#111'; ctx.lineWidth=eh*0.32;
  ctx.beginPath();
  if (mood==='serious') ctx.ellipse(ex,ey-eh*0.18,ew,eh,0,Math.PI,0);
  else if (mood==='confident') ctx.ellipse(ex,ey-eh*0.1,ew,eh*0.82,0,Math.PI,0);
  else ctx.ellipse(ex,ey-eh*0.04,ew*1.04,eh,0,Math.PI,0);
  ctx.stroke();
  // 7. Thin lower eyelid
  ctx.lineWidth=eh*0.09; ctx.beginPath();
  ctx.ellipse(ex,ey+eh*0.12,ew*0.88,eh*0.55,0,0,Math.PI); ctx.stroke();
  // 8. Large white highlight top-left
  ctx.fillStyle='rgba(255,255,255,0.92)';
  ctx.beginPath(); ctx.ellipse(ex-ir*0.28,ey-ir*0.28,ir*0.28,ir*0.2,-0.4,0,Math.PI*2); ctx.fill();
  // 9. Small dot highlight bottom-right
  ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.beginPath(); ctx.arc(ex+ir*0.32,ey+ir*0.32,ir*0.09,0,Math.PI*2); ctx.fill();
}

function drawAnimeEyes(cx, cy, headW, headH, irisColor, mood) {
  const sp=headW*0.3;
  const ew=headW*0.21, eh=headH*0.27;
  drawAnimeEye(cx-sp, cy, ew, eh, irisColor, mood);
  drawAnimeEye(cx+sp, cy, ew, eh, irisColor, mood);
}

// KAI — Ryu-inspired, red gems
function drawKai(cx, cy, scale, pose) {
  const H=120*scale;
  const hH=H*0.42, hW=hH*0.88;
  const bY=cy-H*0.5+hH*1.05, hY=cy-H*0.5+hH*0.5;
  const bW=hW*0.85, bH=H*0.3;
  ctx.save();

  // Legs
  ctx.fillStyle='#f0f0ee';
  const lW=bW*0.3, lH=H*0.22;
  ctx.beginPath(); ctx.roundRect(cx-bW*0.25,bY+bH*0.7,lW,lH,3*scale); ctx.fill();
  ctx.beginPath(); ctx.roundRect(cx+bW*0.25-lW*0.5,bY+bH*0.7,lW,lH,3*scale); ctx.fill();
  ctx.fillStyle='#1a1a1a';
  ctx.beginPath(); ctx.roundRect(cx-bW*0.28,bY+bH*0.7+lH*0.85,lW*1.15,lH*0.2,2*scale); ctx.fill();
  ctx.beginPath(); ctx.roundRect(cx+bW*0.22-lW*0.5,bY+bH*0.7+lH*0.85,lW*1.15,lH*0.2,2*scale); ctx.fill();

  // Body
  ctx.fillStyle='#f0f0ee';
  ctx.beginPath(); ctx.roundRect(cx-bW/2,bY-bH*0.1,bW,bH,4*scale); ctx.fill();
  ctx.strokeStyle='#ccccc0'; ctx.lineWidth=scale; ctx.stroke();
  // V-neck
  ctx.strokeStyle='#aaaaaa'; ctx.lineWidth=1.5*scale;
  ctx.beginPath(); ctx.moveTo(cx-bW*0.15,bY); ctx.lineTo(cx,bY+bH*0.38); ctx.lineTo(cx+bW*0.15,bY); ctx.stroke();
  // Belt
  ctx.fillStyle='#1a2a4a';
  ctx.fillRect(cx-bW/2,bY+bH*0.57,bW,bH*0.12);

  // Arms
  ctx.fillStyle='#f5c5a0';
  const aW=hW*0.22, aH=H*0.28;
  if (pose==='celebrate') {
    ctx.beginPath(); ctx.roundRect(cx-bW/2-aW*0.5,bY-bH*0.25,aW,aH*0.7,4*scale); ctx.fill();
    ctx.beginPath(); ctx.roundRect(cx+bW/2-aW*0.5,bY-bH*0.25,aW,aH*0.7,4*scale); ctx.fill();
    ctx.beginPath(); ctx.arc(cx-bW/2-aW*0.05,bY-bH*0.25+aH*0.55,aW*0.52,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+bW/2+aW*0.05,bY-bH*0.25+aH*0.55,aW*0.52,0,Math.PI*2); ctx.fill();
  } else if (pose==='hurt') {
    // arms flail back
    ctx.beginPath(); ctx.roundRect(cx-bW/2-aW*0.3,bY-bH*0.15,aW,aH*0.7,4*scale); ctx.fill();
    ctx.beginPath(); ctx.roundRect(cx+bW/2-aW*0.7,bY-bH*0.18,aW,aH*0.7,4*scale); ctx.fill();
    ctx.beginPath(); ctx.arc(cx-bW/2+aW*0.2,bY-bH*0.15+aH*0.65,aW*0.52,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+bW/2-aW*0.2,bY-bH*0.18+aH*0.65,aW*0.52,0,Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.roundRect(cx-bW/2-aW*0.65,bY+bH*0.05,aW,aH*0.82,4*scale); ctx.fill();
    ctx.beginPath(); ctx.roundRect(cx+bW/2-aW*0.35,bY+bH*0.05,aW,aH*0.82,4*scale); ctx.fill();
    ctx.beginPath(); ctx.arc(cx-bW/2-aW*0.18,bY+bH*0.05+aH*0.78,aW*0.52,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#c8906a'; ctx.lineWidth=scale; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx+bW/2+aW*0.18,bY+bH*0.05+aH*0.78,aW*0.52,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#c8906a'; ctx.stroke();
  }

  // HEAD - skin
  ctx.fillStyle='#f5c5a0';
  ctx.beginPath(); ctx.ellipse(cx,hY,hW/2,hH/2,0,0,Math.PI*2); ctx.fill();

  // Hair - black spiky
  ctx.fillStyle='#1a1a1a';
  ctx.beginPath(); ctx.ellipse(cx,hY-hH*0.08,hW/2*1.02,hH/2*0.72,0,Math.PI,0); ctx.fill();
  // Spikes
  const spk=[[-0.38,-0.9,0.14],[-0.18,-1.02,0.16],[0.04,-1.06,0.17],[0.24,-0.97,0.16],[0.42,-0.85,0.14]];
  for (const [sx,sy,sr] of spk) {
    ctx.beginPath();
    ctx.moveTo(cx+sx*hW*0.44,hY-hH*0.03);
    ctx.lineTo(cx+(sx+sr*0.5)*hW*0.44,hY+sy*hH*0.52);
    ctx.lineTo(cx+(sx+sr)*hW*0.44,hY-hH*0.02);
    ctx.fill();
  }
  // Front bang
  ctx.beginPath(); ctx.ellipse(cx-hW*0.14,hY-hH*0.22,hW*0.12,hH*0.15,-0.3,0,Math.PI*2); ctx.fill();

  // Headband
  ctx.strokeStyle='#cc0000'; ctx.lineWidth=hH*0.065;
  ctx.beginPath(); ctx.ellipse(cx,hY-hH*0.02,hW/2*1.04,hH/2*0.76,0,Math.PI*0.84,Math.PI*0.16); ctx.stroke();
  // Knot & trailing ends
  ctx.fillStyle='#cc0000';
  ctx.beginPath(); ctx.arc(cx+hW*0.46,hY-hH*0.08,hH*0.055,0,Math.PI*2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx+hW*0.46,hY-hH*0.04);
  ctx.lineTo(cx+hW*0.6,hY+hH*0.06);
  ctx.lineTo(cx+hW*0.56,hY+hH*0.15);
  ctx.lineTo(cx+hW*0.46,hY+hH*0.04); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx+hW*0.46,hY-hH*0.06);
  ctx.lineTo(cx+hW*0.64,hY-hH*0.01);
  ctx.lineTo(cx+hW*0.62,hY+hH*0.11);
  ctx.lineTo(cx+hW*0.48,hY+hH*0.02); ctx.fill();

  // Ears
  ctx.fillStyle='#f0b896';
  ctx.beginPath(); ctx.ellipse(cx-hW*0.49,hY+hH*0.04,hW*0.1,hH*0.1,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+hW*0.49,hY+hH*0.04,hW*0.1,hH*0.1,0,0,Math.PI*2); ctx.fill();

  // Eyes
  drawAnimeEyes(cx,hY+hH*0.04,hW,hH,'#4a5a7a','serious');

  // Nose
  ctx.strokeStyle='#c8906a'; ctx.lineWidth=scale*1.2;
  ctx.beginPath(); ctx.moveTo(cx+hW*0.06,hY+hH*0.2); ctx.lineTo(cx+hW*0.06,hY+hH*0.28); ctx.stroke();
  // Mouth - straight serious
  ctx.strokeStyle='#a06040'; ctx.lineWidth=scale*1.5;
  ctx.beginPath(); ctx.moveTo(cx-hW*0.12,hY+hH*0.32); ctx.lineTo(cx+hW*0.12,hY+hH*0.32); ctx.stroke();

  ctx.restore();
}

// MEI — Chun-Li-inspired, blue gems
function drawMei(cx, cy, scale, pose) {
  const H=120*scale;
  const hH=H*0.42, hW=hH*0.86;
  const bY=cy-H*0.5+hH*1.05, hY=cy-H*0.5+hH*0.5;
  const bW=hW*0.82, bH=H*0.32;
  ctx.save();

  // Legs
  ctx.fillStyle='#2244cc';
  const lW=bW*0.28, lH=H*0.22;
  ctx.beginPath(); ctx.roundRect(cx-bW*0.28,bY+bH*0.88,lW,lH,3*scale); ctx.fill();
  ctx.beginPath(); ctx.roundRect(cx+bW*0.28-lW,bY+bH*0.88,lW,lH,3*scale); ctx.fill();
  ctx.fillStyle='#1a1a5a';
  ctx.beginPath(); ctx.roundRect(cx-bW*0.31,bY+bH*0.88+lH*0.78,lW*1.2,lH*0.28,2*scale); ctx.fill();
  ctx.beginPath(); ctx.roundRect(cx+bW*0.25-lW,bY+bH*0.88+lH*0.78,lW*1.2,lH*0.28,2*scale); ctx.fill();

  // Body
  ctx.fillStyle='#2244cc';
  ctx.beginPath(); ctx.roundRect(cx-bW/2,bY-bH*0.1,bW,bH*1.05,5*scale); ctx.fill();
  // Yellow collar trim
  ctx.strokeStyle='#ffdd00'; ctx.lineWidth=2.5*scale;
  ctx.beginPath(); ctx.moveTo(cx-bW*0.22,bY); ctx.lineTo(cx,bY+bH*0.22); ctx.lineTo(cx+bW*0.22,bY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-bW/2+2*scale,bY-bH*0.08); ctx.lineTo(cx+bW/2-2*scale,bY-bH*0.08); ctx.stroke();

  // Arms
  ctx.fillStyle='#f5c5a0';
  const aW=hW*0.21;
  const aH_mei=H*0.28;
  if (pose==='celebrate') {
    ctx.beginPath(); ctx.roundRect(cx-bW/2-aW*0.4,bY-bH*0.2,aW,bH*0.6,4*scale); ctx.fill();
    ctx.beginPath(); ctx.roundRect(cx+bW/2-aW*0.6,bY-bH*0.2,aW,bH*0.6,4*scale); ctx.fill();
    ctx.beginPath(); ctx.arc(cx-bW/2,bY-bH*0.2+bH*0.56,aW*0.6,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+bW/2,bY-bH*0.2+bH*0.56,aW*0.6,0,Math.PI*2); ctx.fill();
  } else if (pose==='hurt') {
    // arms flail back
    ctx.beginPath(); ctx.roundRect(cx-bW/2-aW*0.3,bY-bH*0.15,aW,aH_mei*0.7,4*scale); ctx.fill();
    ctx.beginPath(); ctx.roundRect(cx+bW/2-aW*0.7,bY-bH*0.18,aW,aH_mei*0.7,4*scale); ctx.fill();
    ctx.beginPath(); ctx.arc(cx-bW/2+aW*0.2,bY-bH*0.15+aH_mei*0.65,aW*0.52,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+bW/2-aW*0.2,bY-bH*0.18+aH_mei*0.65,aW*0.52,0,Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.roundRect(cx-bW/2-aW*0.5,bY+bH*0.22,aW,bH*0.52,4*scale); ctx.fill();
    ctx.beginPath(); ctx.roundRect(cx+bW/2-aW*0.5,bY+bH*0.22,aW,bH*0.52,4*scale); ctx.fill();
    ctx.beginPath(); ctx.arc(cx-bW/2,bY+bH*0.74,aW*0.58,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#c8906a'; ctx.lineWidth=scale; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx+bW/2,bY+bH*0.74,aW*0.58,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#c8906a'; ctx.stroke();
  }

  // HEAD
  ctx.fillStyle='#f5c5a0';
  ctx.beginPath(); ctx.ellipse(cx,hY,hW/2,hH/2,0,0,Math.PI*2); ctx.fill();
  // Hair base
  ctx.fillStyle='#1a1a1a';
  ctx.beginPath(); ctx.ellipse(cx,hY-hH*0.08,hW/2*1.0,hH/2*0.68,0,Math.PI,0); ctx.fill();
  // Buns
  ctx.beginPath(); ctx.arc(cx-hW*0.43,hY-hH*0.3,hW*0.2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+hW*0.43,hY-hH*0.3,hW*0.2,0,Math.PI*2); ctx.fill();
  // Gold hairpins
  ctx.fillStyle='#ffdd00';
  ctx.beginPath(); ctx.arc(cx-hW*0.43,hY-hH*0.35,hW*0.065,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+hW*0.43,hY-hH*0.35,hW*0.065,0,Math.PI*2); ctx.fill();
  // Cross on pins
  ctx.strokeStyle='#cc9900'; ctx.lineWidth=scale*1.5;
  for (const bx of [cx-hW*0.43, cx+hW*0.43]) {
    const by=hY-hH*0.35;
    ctx.beginPath(); ctx.moveTo(bx-hW*0.04,by); ctx.lineTo(bx+hW*0.04,by); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx,by-hW*0.04); ctx.lineTo(bx,by+hW*0.04); ctx.stroke();
  }
  // Ears
  ctx.fillStyle='#f0b896';
  ctx.beginPath(); ctx.ellipse(cx-hW*0.49,hY+hH*0.04,hW*0.1,hH*0.1,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+hW*0.49,hY+hH*0.04,hW*0.1,hH*0.1,0,0,Math.PI*2); ctx.fill();
  // Eyes
  drawAnimeEyes(cx,hY+hH*0.04,hW,hH,'#8a5a2a','cheerful');
  // Rosy cheeks
  ctx.fillStyle='rgba(255,150,130,0.32)';
  ctx.beginPath(); ctx.ellipse(cx-hW*0.3,hY+hH*0.18,hW*0.1,hH*0.07,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+hW*0.3,hY+hH*0.18,hW*0.1,hH*0.07,0,0,Math.PI*2); ctx.fill();
  // Nose
  ctx.strokeStyle='#c8906a'; ctx.lineWidth=scale*1.2;
  ctx.beginPath(); ctx.moveTo(cx+hW*0.05,hY+hH*0.2); ctx.lineTo(cx+hW*0.05,hY+hH*0.27); ctx.stroke();
  // Small smile
  ctx.strokeStyle='#a06040'; ctx.lineWidth=scale*1.5;
  ctx.beginPath(); ctx.arc(cx,hY+hH*0.28,hW*0.1,0.1,Math.PI*0.9); ctx.stroke();

  ctx.restore();
}

// RIKU — Ken-inspired, yellow gems
function drawRiku(cx, cy, scale, pose) {
  const H=120*scale;
  const hH=H*0.42, hW=hH*0.88;
  const bY=cy-H*0.5+hH*1.05, hY=cy-H*0.5+hH*0.5;
  const bW=hW*0.85, bH=H*0.3;
  ctx.save();

  // Legs
  ctx.fillStyle='#cc2200';
  const lW=bW*0.3, lH=H*0.22;
  ctx.beginPath(); ctx.roundRect(cx-bW*0.25,bY+bH*0.7,lW,lH,3*scale); ctx.fill();
  ctx.beginPath(); ctx.roundRect(cx+bW*0.25-lW*0.5,bY+bH*0.7,lW,lH,3*scale); ctx.fill();
  ctx.fillStyle='#1a1a1a';
  ctx.beginPath(); ctx.roundRect(cx-bW*0.28,bY+bH*0.7+lH*0.85,lW*1.1,lH*0.2,2*scale); ctx.fill();
  ctx.beginPath(); ctx.roundRect(cx+bW*0.22-lW*0.5,bY+bH*0.7+lH*0.85,lW*1.1,lH*0.2,2*scale); ctx.fill();

  // Body - red gi jacket
  ctx.fillStyle='#cc2200';
  ctx.beginPath(); ctx.roundRect(cx-bW/2,bY-bH*0.1,bW,bH,4*scale); ctx.fill();
  ctx.strokeStyle='#991800'; ctx.lineWidth=scale; ctx.stroke();
  // White undershirt triangle
  ctx.fillStyle='#f0f0ee';
  ctx.beginPath(); ctx.moveTo(cx-bW*0.18,bY); ctx.lineTo(cx,bY+bH*0.52); ctx.lineTo(cx+bW*0.18,bY); ctx.closePath(); ctx.fill();
  // Belt
  ctx.fillStyle='#883300';
  ctx.fillRect(cx-bW/2,bY+bH*0.56,bW,bH*0.1);

  // Arms
  ctx.fillStyle='#f5c0a5';
  const aW=hW*0.22, aH=H*0.28;
  if (pose==='celebrate') {
    ctx.beginPath(); ctx.roundRect(cx-bW/2-aW*0.5,bY-bH*0.2,aW,aH*0.7,4*scale); ctx.fill();
    ctx.beginPath(); ctx.roundRect(cx+bW/2-aW*0.5,bY-bH*0.2,aW,aH*0.7,4*scale); ctx.fill();
    ctx.fillStyle='#883300';
    ctx.beginPath(); ctx.arc(cx-bW/2-aW*0.05,bY-bH*0.2+aH*0.56,aW*0.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+bW/2+aW*0.05,bY-bH*0.2+aH*0.56,aW*0.5,0,Math.PI*2); ctx.fill();
  } else if (pose==='hurt') {
    // arms flail back
    ctx.beginPath(); ctx.roundRect(cx-bW/2-aW*0.3,bY-bH*0.15,aW,aH*0.7,4*scale); ctx.fill();
    ctx.beginPath(); ctx.roundRect(cx+bW/2-aW*0.7,bY-bH*0.18,aW,aH*0.7,4*scale); ctx.fill();
    ctx.beginPath(); ctx.arc(cx-bW/2+aW*0.2,bY-bH*0.15+aH*0.65,aW*0.52,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+bW/2-aW*0.2,bY-bH*0.18+aH*0.65,aW*0.52,0,Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.roundRect(cx-bW/2-aW*0.6,bY+bH*0.05,aW,aH*0.75,4*scale); ctx.fill();
    // Pointing arm to right
    ctx.beginPath(); ctx.roundRect(cx+bW/2-aW*0.1,bY,aW*1.4,aH*0.5,4*scale); ctx.fill();
    // Glove
    ctx.fillStyle='#883300';
    ctx.beginPath(); ctx.arc(cx-bW/2-aW*0.15,bY+aH*0.72,aW*0.5,0,Math.PI*2); ctx.fill();
    // Pointing finger
    ctx.fillStyle='#f5c0a5';
    ctx.beginPath(); ctx.roundRect(cx+bW/2+aW*1.15,bY+aH*0.3,aW*0.62,aW*0.24,2*scale); ctx.fill();
    ctx.fillStyle='#883300';
    ctx.beginPath(); ctx.roundRect(cx+bW/2+aW*0.88,bY+aH*0.15,aW*0.58,aH*0.44,4*scale); ctx.fill();
  }

  // HEAD
  ctx.fillStyle='#f5c0a5';
  ctx.beginPath(); ctx.ellipse(cx,hY,hW/2,hH/2,0,0,Math.PI*2); ctx.fill();
  // Blonde spiky hair
  ctx.fillStyle='#ddaa00';
  const sk=[[-0.4,-0.72,0.14],[-0.2,-0.94,0.16],[0.0,-1.02,0.17],[0.2,-0.92,0.16],[0.38,-0.74,0.14]];
  for (const [sx,sy,sr] of sk) {
    ctx.beginPath();
    ctx.moveTo(cx+sx*hW*0.52,hY-hH*0.08);
    ctx.lineTo(cx+(sx+sr*0.5)*hW*0.52,hY+sy*hH*0.52);
    ctx.lineTo(cx+(sx+sr)*hW*0.52,hY-hH*0.04);
    ctx.fill();
  }
  ctx.beginPath(); ctx.ellipse(cx,hY-hH*0.06,hW/2*1.02,hH/2*0.65,0,Math.PI,0); ctx.fill();
  // Hair highlight
  ctx.fillStyle='#ffcc44';
  ctx.beginPath(); ctx.ellipse(cx-hW*0.12,hY-hH*0.36,hW*0.06,hH*0.17,-0.3,0,Math.PI*2); ctx.fill();
  // Ears
  ctx.fillStyle='#e8ad8a';
  ctx.beginPath(); ctx.ellipse(cx-hW*0.49,hY+hH*0.04,hW*0.1,hH*0.1,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+hW*0.49,hY+hH*0.04,hW*0.1,hH*0.1,0,0,Math.PI*2); ctx.fill();
  // Eyes - confident
  drawAnimeEyes(cx,hY+hH*0.04,hW,hH,'#3a8a9a','confident');
  // Nose
  ctx.strokeStyle='#c0805a'; ctx.lineWidth=scale*1.2;
  ctx.beginPath(); ctx.moveTo(cx+hW*0.06,hY+hH*0.2); ctx.lineTo(cx+hW*0.06,hY+hH*0.27); ctx.stroke();
  // Big confident grin
  ctx.strokeStyle='#a06040'; ctx.lineWidth=scale*1.8;
  ctx.beginPath(); ctx.arc(cx,hY+hH*0.24,hW*0.17,0.08,Math.PI*0.92); ctx.stroke();
  // Teeth
  ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.arc(cx,hY+hH*0.24,hW*0.17,0.08,Math.PI*0.92); ctx.lineTo(cx,hY+hH*0.24); ctx.closePath(); ctx.fill();

  ctx.restore();
}

// SHADOW — Akuma-inspired, green gems
function drawShadow(cx, cy, scale, pose) {
  const H=120*scale;
  const hH=H*0.42, hW=hH*0.9;
  const bY=cy-H*0.5+hH*1.05, hY=cy-H*0.5+hH*0.5;
  const bW=hW*0.88, bH=H*0.3;
  ctx.save();

  // Legs
  ctx.fillStyle='#220033';
  const lW=bW*0.3, lH=H*0.22;
  ctx.beginPath(); ctx.roundRect(cx-bW*0.25,bY+bH*0.7,lW,lH,3*scale); ctx.fill();
  ctx.beginPath(); ctx.roundRect(cx+bW*0.25-lW*0.5,bY+bH*0.7,lW,lH,3*scale); ctx.fill();
  ctx.fillStyle='#1a1a1a';
  ctx.beginPath(); ctx.roundRect(cx-bW*0.28,bY+bH*0.7+lH*0.85,lW*1.1,lH*0.2,2*scale); ctx.fill();
  ctx.beginPath(); ctx.roundRect(cx+bW*0.22-lW*0.5,bY+bH*0.7+lH*0.85,lW*1.1,lH*0.2,2*scale); ctx.fill();

  // Body
  ctx.fillStyle='#220033';
  ctx.beginPath(); ctx.roundRect(cx-bW/2,bY-bH*0.1,bW,bH,4*scale); ctx.fill();
  ctx.strokeStyle='#440066'; ctx.lineWidth=scale; ctx.stroke();
  // Torn edges
  ctx.strokeStyle='#330044'; ctx.lineWidth=scale*0.9;
  for (let i=0;i<5;i++) {
    const tx=cx-bW/2+(i+0.4)*(bW/5);
    ctx.beginPath(); ctx.moveTo(tx,bY+bH*0.92); ctx.lineTo(tx+scale*2.5,bY+bH*0.85); ctx.lineTo(tx+scale*5,bY+bH*0.93); ctx.stroke();
  }
  // Red kanji
  ctx.fillStyle='#cc2200'; ctx.font=`bold ${14*scale}px serif`; ctx.textAlign='center';
  ctx.fillText('天',cx,bY+bH*0.46);

  // Magatama beads
  const bC=9;
  for (let i=0;i<bC;i++) {
    const ang=-Math.PI+(i/(bC-1))*Math.PI;
    const bx=cx+Math.cos(ang)*hW*0.36;
    const by2=(bY-bH*0.08)+Math.sin(ang)*hH*0.12;
    ctx.fillStyle=i%2===0?'#cc2200':'#ff5500';
    ctx.beginPath(); ctx.arc(bx,by2,hW*0.042,0,Math.PI*2); ctx.fill();
  }

  // Arms - crossed
  ctx.fillStyle='#c8a090';
  const aW=hW*0.22, aH=H*0.28;
  if (pose==='celebrate') {
    ctx.beginPath(); ctx.roundRect(cx-bW/2-aW*0.4,bY-bH*0.2,aW,aH*0.65,4*scale); ctx.fill();
    ctx.beginPath(); ctx.roundRect(cx+bW/2-aW*0.6,bY-bH*0.2,aW,aH*0.65,4*scale); ctx.fill();
    ctx.beginPath(); ctx.arc(cx-bW/2-aW*0.05,bY-bH*0.2+aH*0.52,aW*0.52,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+bW/2+aW*0.05,bY-bH*0.2+aH*0.52,aW*0.52,0,Math.PI*2); ctx.fill();
  } else if (pose==='hurt') {
    // arms flail back
    ctx.beginPath(); ctx.roundRect(cx-bW/2-aW*0.3,bY-bH*0.15,aW,aH*0.7,4*scale); ctx.fill();
    ctx.beginPath(); ctx.roundRect(cx+bW/2-aW*0.7,bY-bH*0.18,aW,aH*0.7,4*scale); ctx.fill();

// ============================================================
// GAME LOGIC
// ============================================================
function makeBoard() { return Array.from({length:ROWS},()=>Array(COLS).fill(null)); }

// Piece rotations: each orientation gives [offset1, offset2] from piece origin
const ROTS=[
  [[0,0],[1,0]],   // 0: horizontal right
  [[0,0],[0,1]],   // 1: vertical down
  [[0,0],[-1,0]],  // 2: horizontal left
  [[0,0],[0,-1]]   // 3: vertical up
];

// Returns a color STRING — fixes gray-block bug (PAL keys are strings, not numbers)
function randomColor(charIdx) {
  const idx = Math.random()<0.3 ? charIdx : Math.floor(Math.random()*4);
  return CHAR_COLORS[idx];
}
// Returns {color:string, type:TN|TC} — 15% chance crash gem
function randomGem(charIdx) {
  return { color: randomColor(charIdx), type: Math.random()<0.15 ? TC : TN };
}

// ============================================================
// PIECE QUEUE — guarantees power gem opportunities
// ============================================================
class PieceQueue {
  constructor(charIdx) {
    this.charIdx = charIdx;
    this.bag = [];
    this.count = 0;
  }

  _charColor() {
    // Character-specific weighted distributions
    // Weights: [red, blue, yellow, green] for each character
    const weights = [
      [0.40, 0.20, 0.20, 0.20],  // KAI (0): 40% red
      [0.25, 0.30, 0.20, 0.25],  // MEI (1): 30% blue
      [0.25, 0.20, 0.35, 0.20],  // RIKU (2): 35% yellow
      [0.30, 0.20, 0.20, 0.30],  // SHADOW (3): 30% green, 30% red
    ];
    const w = weights[this.charIdx] || [0.25, 0.25, 0.25, 0.25];
    const r = Math.random();
    let cum = 0;
    for (let i = 0; i < w.length; i++) {
      cum += w[i];
      if (r < cum) return CHAR_COLORS[i];
    }
    return CHAR_COLORS[this.charIdx];
  }

  _gem(forceColor) {
    const color = forceColor || this._charColor();
    const isCrash = !forceColor && Math.random() < 0.22;
    // Crash gems ALWAYS match the character's primary color so they reliably clear your stack
    return { color: isCrash ? CHAR_COLORS[this.charIdx] : color, type: isCrash ? TC : TN };
  }

  next() {
    if (this.bag.length === 0) this._refill();
    this.count++;
    return this.bag.shift();
  }

  peek(offset) {
    // Ensure we have enough pieces buffered
    while (this.bag.length <= offset) this._refill();
    return this.bag[offset];
  }

  _refill() {
    // Generate 6 pieces at a time:
    // Pieces 0,1,3,4: mixed (builds board variety)
    // Pieces 2,5: MATCHED PAIR (same color both gems — guarantees power gem chance)
    const matchColor1 = this._charColor();
    const matchColor2 = CHAR_COLORS[Math.floor(Math.random()*4)];

    for (let i = 0; i < 6; i++) {
      if (i === 2 || i === 5) {
        // Matched pair
        const mc = (i === 2) ? matchColor1 : matchColor2;
        this.bag.push({ c1:mc, t1:TN, c2:mc, t2:TN });
      } else {
        const g1 = this._gem();
        const g2 = this._gem();
        this.bag.push({ c1:g1.color, t1:g1.type, c2:g2.color, t2:g2.type });
      }
    }
  }
}

let boards=[null,null], pieces=[null,null];
let queues=[null,null];
let scores=[0,0], attackBuffer=[0,0], fallTimers=[0,0];
let fallDelay=[600,800], gameOver=false, gamePaused=false, gameTime=0, aiTimer=0;
let attackWarning=[0,0];
let superMeter=[0,0];
const SUPER_MAX=100;

// Lock delay state
let lockDelayTimer=[0,0], lockDelayActive=[false,false], lockMoveCount=[0,0];
const MAX_LOCK_RESETS=8;

// Chain combo display
let chainDisplay=[{chain:0,timer:0},{chain:0,timer:0}];
// ALL CLEAR display
let allClearDisplay=[{timer:0},{timer:0}];

// Animation system state
let fallProgress = [0, 0]; // 0.0-1.0 fractional progress toward next row
const gemBreaks = []; // {x, y, color, timer, maxTimer}
let spawnFlash = [0, 0]; // countdown timer in seconds

function getPieceCells(p) {
  const r=ROTS[p.orient%4];
  return [ [p.x+r[0][0], p.y+r[0][1]], [p.x+r[1][0], p.y+r[1][1]] ];
}

function isValid(board, p) {
  for (const [cx2,cy2] of getPieceCells(p)) {
    if (cx2<0||cx2>=COLS||cy2>=ROWS) return false;
    if (cy2>=0 && board[cy2][cx2]) return false;
  }
  return true;
}

function spawnPiece(bi) {
  // Apply buffered attacks before spawning
  if (attackBuffer[bi] > 0) {
    addCounterGems(bi, attackBuffer[bi]);
    attackBuffer[bi] = 0;
  }
  // Reset lock delay state for new piece
  lockDelayActive[bi] = false;
  lockDelayTimer[bi] = 0;
  lockMoveCount[bi] = 0;

  // Decrement counter gem counts; convert to playable when reaching 0
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const g = boards[bi][r][c];
      if (g && g.type === TK) {
        if (g.count !== undefined && g.count > 0) {
          g.count--;
          if (g.count <= 0) {
            // Convert to a normal gem of a random color
            boards[bi][r][c] = { type: TN, color: CHAR_COLORS[Math.floor(Math.random() * 4)] };
          }
        }
      }
    }
  }

  // Get next piece from queue
  const next = queues[bi].next();
  pieces[bi] = { c1:next.c1, t1:next.t1, c2:next.c2, t2:next.t2, x:2, y:0, orient:0 };

  fallProgress[bi] = 0;
  spawnFlash[bi] = 0.18;

  for (const [cx2,cy2] of getPieceCells(pieces[bi])) {
    if (cy2>=0 && boards[bi][cy2][cx2]) return false;
  }
  return true;
}

function applyGravity(board) {
  let moved=true;
  while (moved) {
    moved=false;
    for (let r=ROWS-2;r>=0;r--) {
      for (let c=0;c<COLS;c++) {
        if (board[r][c] && !board[r+1][c]) {
          board[r+1][c]=board[r][c]; board[r][c]=null; moved=true;
        }
      }
    }
  }
}

function checkPowerGems(board) {
  let formed=false, changed=true;
  // Loop until stable — allows blocks to grow beyond 2x2
  while (changed) {
    changed=false;
    for (let r=0;r<ROWS-1;r++) {
      for (let c=0;c<COLS-1;c++) {
        const g=board[r][c];
        // Accept both normal AND existing power gems so blocks can expand
        if (!g||(g.type!==TN&&g.type!==TP)) continue;
        const g2=board[r][c+1], g3=board[r+1][c], g4=board[r+1][c+1];
        if (!g2||!g3||!g4) continue;
        if ((g2.type!==TN&&g2.type!==TP)||(g3.type!==TN&&g3.type!==TP)||(g4.type!==TN&&g4.type!==TP)) continue;
        if (g.color!==g2.color||g.color!==g3.color||g.color!==g4.color) continue;
        // Only mark changed if at least one cell is still TN (new merge)
        if (g.type===TN||g2.type===TN||g3.type===TN||g4.type===TN) {
          board[r][c]={type:TP,color:g.color};
          board[r][c+1]={type:TP,color:g.color};
          board[r+1][c]={type:TP,color:g.color};
          board[r+1][c+1]={type:TP,color:g.color};
          changed=true; formed=true;
        }
      }
    }
  }
  if (formed) sfx('power');
}

function floodFill(board, r, c, color, visited) {
  const key=r*COLS+c;
  if (visited.has(key)||r<0||r>=ROWS||c<0||c>=COLS) return [];
  const g=board[r][c];
  if (!g) return [];
  if (g.type===TK) { visited.add(key); return [[r,c]]; }
  if (g.color!==color) return [];
  visited.add(key);
  return [[r,c], ...floodFill(board,r-1,c,color,visited), ...floodFill(board,r+1,c,color,visited),
          ...floodFill(board,r,c-1,color,visited), ...floodFill(board,r,c+1,color,visited)];
}

function processChains(bi, chainStep) {
  if (gameOver) return;
  const board=boards[bi];
  const toDestroy=new Set();
  let hasCrash=false;

  for (let r=0;r<ROWS;r++) {
    for (let c=0;c<COLS;c++) {
      const g=board[r][c];
      if (!g||g.type!==TC) continue;
      hasCrash=true;
      const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
      for (const [dr,dc] of dirs) {
        const nr=r+dr, nc=c+dc;
        if (nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
        const n=board[nr][nc];
        if (n&&(n.color===g.color||n.type===TK)) {
          const visited=new Set();
          const cells=floodFill(board,nr,nc,g.color,visited);
          toDestroy.add(r*COLS+c);
          for (const [fr,fc] of cells) {
            const fg=board[fr][fc];
            if (fg&&fg.type===TP) {
              // destroy all power gems of same color in 3x3
              for (let pr=fr-1;pr<=fr+1;pr++) for (let pc=fc-1;pc<=fc+1;pc++) {
                if (pr>=0&&pr<ROWS&&pc>=0&&pc<COLS&&board[pr][pc]&&board[pr][pc].type===TP&&board[pr][pc].color===fg.color)
                  toDestroy.add(pr*COLS+pc);
              }
            }
            toDestroy.add(fr*COLS+fc);
          }
        }
      }
    }
  }

  if (toDestroy.size===0) return;

  sfx(chainStep>1?'chain':'crash');
  if (chainStep===1) vibrate(30);
  else if (chainStep===2) vibrate([30,20,30]);
  else if (chainStep===3) vibrate([50,20,50,20,50]);
  else vibrate([80,20,80,20,80,20,80]);
  if (chainStep>=3) triggerShake(6);

  let destroyed=0;
  for (const key of toDestroy) {
    const r=Math.floor(key/COLS), c=key%COLS;
    if (board[r][c]) {
      const px=(bi===0?LX:RX)+c*CELL+CELL/2;
      const py=BY+r*CELL+CELL/2;
      spawnParticles(px,py,board[r][c].color,6);
      gemBreaks.push({
        x: (bi===0?LX:RX) + c*CELL,
        y: BY + r*CELL,
        color: board[r][c].color,
        timer: 1,
        maxTimer: 0.25
      });
      destroyed++; board[r][c]=null;
    }
  }

  applyGravity(board);
  checkPowerGems(board);

  // ALL CLEAR check — board completely empty after chain
  if (board.every(row => row.every(cell => !cell))) {
    const op = 1 - bi;
    attackBuffer[op] += 12;
    attackWarning[op] = 120;
    sfx('allclear');
    triggerShake(10);
    vibrate([100,30,100,30,100]);
    allClearDisplay[bi].timer = 2.5;
    const charIdx = bi === 0 ? playerChar : cpuChar;
    const acColor = CHAR_COLORS[charIdx];
    const boardOx = bi === 0 ? LX : RX;
    for (let i = 0; i < 40; i++) spawnParticles(boardOx + BW/2, BY + BH/2, acColor, 1);
  }

  const mult=Math.min(chainStep,5);
  const rawAttack=Math.floor(destroyed*mult/3);
  const attack=Math.floor(rawAttack*DIFF_SETTINGS[difficulty].attackMult);
  if (attack>0) {
    const op=1-bi;
    attackBuffer[op]+=attack;
    attackWarning[op]=90;
    sfx('attack');
  }
  scores[bi]+=destroyed*chainStep*10;
  superMeter[bi]=Math.min(SUPER_MAX, superMeter[bi]+destroyed*3);
  updateSuperBtn();

  // Show chain combo counter for chains ≥ 2
  if (chainStep>=2) chainDisplay[bi]={chain:chainStep, timer:1.8};

  setTimeout(()=>processChains(bi,chainStep+1),420);
}

// ============================================================
// SUPER MOVES
// ============================================================
function updateSuperBtn() {
  const btn=document.getElementById('btn-super');
  if(!btn) return;
  if(superMeter[0]>=SUPER_MAX) {
    btn.style.opacity='1';
    btn.style.background='rgba(255,200,0,0.35)';
    btn.style.borderColor='#ffdd00';
    btn.style.boxShadow='0 0 10px #ffdd00';
  } else {
    btn.style.opacity='0.35';
    btn.style.background='rgba(255,200,0,0.1)';
    btn.style.borderColor='rgba(255,200,0,0.3)';
    btn.style.boxShadow='none';
  }
}

function activateSuper(bi) {
  if(superMeter[bi]<SUPER_MAX||gameOver) return;
  superMeter[bi]=0;
  updateSuperBtn();
  const ci=(bi===0)?playerChar:cpuChar;
  const board=boards[bi];
  const op=1-bi;

  switch(ci) {
    case 0: { // KAI — Hadou Burst: blast the tallest column clean, send its count
      let bestCol=0, bestH=0;
      for(let c=0;c<COLS;c++){
        let h=0; for(let r=0;r<ROWS;r++) if(board[r][c]) h++;
        if(h>bestH){bestH=h;bestCol=c;}
      }
      for(let r=0;r<ROWS;r++) board[r][bestCol]=null;
      if(bestH>0){ attackBuffer[op]+=bestH; attackWarning[op]=120; sfx('attack'); }
      break;
    }
    case 1: { // MEI — Spinning Kick: destroy ALL crash gems on board + send 6 attacks
      let kicked=0;
      for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++)
        if(board[r][c]&&board[r][c].type===TC){ board[r][c]=null; kicked++; }
      attackBuffer[op]+=6;
      attackWarning[op]=120;
      sfx('crash');
      break;
    }
    case 2: { // RIKU — Flame Upper: ignite bottom 2 rows (normal→power) + destroy them
      for(let r=ROWS-2;r<ROWS;r++) for(let c=0;c<COLS;c++)
        if(board[r][c]&&board[r][c].type===TN) board[r][c]={type:TP,color:board[r][c].color};
      sfx('power');
      setTimeout(()=>{ processChains(bi,1); },200);
      break;
    }
    case 3: { // SHADOW — Dark Spiral: drop 8 heavy counter gems on opponent
      attackBuffer[op]+=8;
      attackWarning[op]=180;
      sfx('attack');
      // Also darken the opponent board briefly (visual flash handled in drawBoard)
      break;
    }
  }

  applyGravity(board);
}

function lockPiece(bi) {
  const p=pieces[bi];
  const cells=getPieceCells(p);
  if (cells[0][1]>=0&&cells[0][1]<ROWS) boards[bi][cells[0][1]][cells[0][0]]={type:p.t1||TN,color:p.c1};
  if (cells[1][1]>=0&&cells[1][1]<ROWS) boards[bi][cells[1][1]][cells[1][0]]={type:p.t2||TN,color:p.c2};
  sfx('place');
  vibrate(15);
  pieces[bi]=null;
  fallProgress[bi]=0;
  lockDelayActive[bi]=false;
  lockDelayTimer[bi]=0;
  lockMoveCount[bi]=0;
  checkPowerGems(boards[bi]);
  applyGravity(boards[bi]);
  processChains(bi,1);
}

function addCounterGems(bi, count) {
  if (!count || count<=0) return;
  if (bi===0) triggerShake(4);
  vibrate([60, 30, 60]);
  const clamped=Math.min(count,COLS*3);
  const rows=Math.max(1,Math.ceil(clamped/COLS));
  // Shift board up
  for (let r=0;r<ROWS-rows;r++) for (let c=0;c<COLS;c++) boards[bi][r][c]=boards[bi][r+rows][c];
  let rem=clamped;
  for (let r=ROWS-rows;r<ROWS;r++) {
    // Higher rows show larger count numbers (rows near top have more countdown)
    const rowCount = Math.ceil(clamped / COLS) + (ROWS - rows - r);
    for (let c=0;c<COLS;c++) {
      boards[bi][r][c]=rem>0?{type:TK,color:'gray',count:rowCount}:null;
      rem--;
    }
  }
}

// ============================================================
// AI
// ============================================================
function evalBoard(board) {
  let sc=0;
  for (let c=0;c<COLS;c++) {
    let found=false;
    for (let r=0;r<ROWS;r++) {
      if (board[r][c]) {
        if (!found) { sc-=(ROWS-r)*2; found=true; }
      } else if (found) sc-=5;
    }
  }
  for (let r=0;r<ROWS-1;r++) for (let c=0;c<COLS-1;c++) {
    const g=board[r][c];
    if (!g||g.type===TK) continue;
    if (board[r+1][c]&&board[r+1][c].color===g.color) sc+=3;
    if (board[r][c+1]&&board[r][c+1].color===g.color) sc+=3;
  }
  return sc;
}

function doAI() {
  const p=pieces[1];
  if (!p||gameOver) return;
  let best=-Infinity, bX=p.x, bO=0;
  for (let o=0;o<4;o++) {
    for (let x=0;x<COLS;x++) {
      const tp={...p,x,orient:o};
      if (!isValid(boards[1],tp)) continue;
      let ty=tp.y;
      while (isValid(boards[1],{...tp,y:ty+1})) ty++;
      const dropped={...tp,y:ty};
      const sim=boards[1].map(r=>[...r]);
      const cells=getPieceCells(dropped);
      if (cells[0][1]>=0&&cells[0][1]<ROWS) sim[cells[0][1]][cells[0][0]]={type:p.t1||TN,color:p.c1};
      if (cells[1][1]>=0&&cells[1][1]<ROWS) sim[cells[1][1]][cells[1][0]]={type:p.t2||TN,color:p.c2};
      const s=evalBoard(sim);
      if (s>best) { best=s; bX=x; bO=o; }
    }
  }
  // CPU uses super when ready
  if (superMeter[1]>=SUPER_MAX) { activateSuper(1); return; }
  // Apply AI error at easy difficulty — sometimes pick wrong target
  const ds=DIFF_SETTINGS[difficulty];
  if (ds.aiError > 0 && Math.random() < ds.aiError) {
    bX = Math.floor(Math.random()*COLS);
    bO = Math.floor(Math.random()*4);
  }
  // Move one step toward target
  if (p.orient!==bO) {
    const no=(p.orient+1)%4;
    const np={...p,orient:no};
    if (isValid(boards[1],np)) pieces[1].orient=no;
  }
  if (p.x<bX) { const np={...p,x:p.x+1}; if (isValid(boards[1],np)) pieces[1].x++; }
  else if (p.x>bX) { const np={...p,x:p.x-1}; if (isValid(boards[1],np)) pieces[1].x--; }
}

function initGame() {
  const ds = DIFF_SETTINGS[difficulty];
  boards=[makeBoard(),makeBoard()];
  pieces=[null,null];
  queues=[new PieceQueue(playerChar), new PieceQueue(cpuChar)];
  scores=[0,0]; attackBuffer=[0,0];
  fallTimers=[0,0]; fallDelay=[ds.gravity, Math.round(ds.gravity*0.85)];
  lockDelayTimer=[0,0]; lockDelayActive=[false,false]; lockMoveCount=[0,0];
  gameOver=false; gamePaused=false; gameTime=0; aiTimer=0; attackWarning=[0,0]; superMeter=[0,0];
  chainDisplay=[{chain:0,timer:0},{chain:0,timer:0}];
  allClearDisplay=[{timer:0},{timer:0}];
  fallProgress=[0,0]; spawnFlash=[0,0]; gemBreaks.length=0;
  updateSuperBtn();
  spawnPiece(0); spawnPiece(1);
}

// ============================================================
// HIGH SCORES
// ============================================================
function getScores() {
  try { return JSON.parse(localStorage.getItem('pf_hiscores') || '{}'); }
  catch(e) { return {}; }
}
function saveScore(score) {
  const key = ['easy','medium','hard'][difficulty];
  const charName = CHAR_NAMES[playerChar];
  const all = getScores();
  if (!all[key]) all[key] = [];
  all[key].push({ score, char: charName, date: new Date().toLocaleDateString() });
  all[key].sort((a,b) => b.score - a.score);
  all[key] = all[key].slice(0, 5);
  localStorage.setItem('pf_hiscores', JSON.stringify(all));
}
function getBestScore(diffIdx) {
  const key = ['easy','medium','hard'][diffIdx];
  const all = getScores();
  if (all[key] && all[key].length > 0) return all[key][0].score;
  return null;
}

  ctx.globalAlpha=0.035;
  ctx.fillStyle='#000000';
  for (let ly=0;ly<H;ly+=4) ctx.fillRect(0,ly,W,2);
  ctx.restore();

  // Draw background gem particles (larger, more dramatic)
  for (const g of bgGems) {
    ctx.save();
    ctx.translate(g.x,g.y); ctx.rotate(g.rot);
    const s=g.size*1.6;
    ctx.shadowColor=g.color; ctx.shadowBlur=s*1.2; ctx.globalAlpha=0.18;

    ctx.beginPath(); ctx.moveTo(0,-s); ctx.lineTo(s*0.6,0); ctx.lineTo(0,s); ctx.lineTo(-s*0.6,0); ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0; ctx.globalAlpha=0.35;
    ctx.beginPath(); ctx.moveTo(0,-s*0.5); ctx.lineTo(s*0.28,0); ctx.lineTo(0,s*0.5); ctx.lineTo(-s*0.28,0); ctx.closePath(); ctx.fill();
    ctx.globalAlpha=1; ctx.restore();

  ctx.save();
  ctx.translate(starCX,starCY);
  ctx.rotate(logoPulse*0.18);
  for (let ri=0;ri<8;ri++) {
    const ang=(ri/8)*Math.PI*2;

    ctx.fillStyle=rayGrad;
    ctx.beginPath(); ctx.moveTo(-rW,0); ctx.lineTo(0,-rLen); ctx.lineTo(rW,0); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  const cGlow=ctx.createRadialGradient(0,0,0,0,0,starR*0.38);
  cGlow.addColorStop(0,`rgba(220,130,255,${0.28+0.12*Math.sin(logoPulse)})`);
  cGlow.addColorStop(0.6,'rgba(100,30,200,0.14)'); cGlow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=cGlow; ctx.beginPath(); ctx.arc(0,0,starR*0.38,0,Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.shadowBlur=0; ctx.fillStyle=lg;

  ctx.strokeText('PUZZLE',W/2,logoY); ctx.strokeText('FIGHTER',W/2,logoY+titleSize*1.12);

  const subY=logoY+titleSize*2.32;

  ctx.fillStyle='rgba(0,0,0,0.8)'; ctx.fillText('2 TURBO REMIX',W/2+2,subY+2);
  const subGrad=ctx.createLinearGradient(W/2-80,subY,W/2+80,subY);
  subGrad.addColorStop(0,'#8888ff'); subGrad.addColorStop(0.5,'#ccccff'); subGrad.addColorStop(1,'#8888ff');
  ctx.fillStyle=subGrad; ctx.shadowColor='#4455ff'; ctx.shadowBlur=8;
  ctx.fillText('2 TURBO REMIX',W/2,subY); ctx.shadowBlur=0;

  // Divider lines flanking subtitle
  const divY=subY+subSize*0.35, divW=Math.min(W*0.14,60);
  for (const dx of [W/2-Math.min(W*0.38,160)-divW/2, W/2+Math.min(W*0.38,160)-divW/2]) {

  // Characters with aura glow

  const kBounce=Math.sin(titleBounce*2.2)*6*sc;

    ctx.fillStyle=aura; ctx.beginPath(); ctx.arc(acx,acy,55*sc,0,Math.PI*2); ctx.fill();
  }
  drawKai(W*0.2,charY+kBounce,sc,'idle');
  drawShadow(W*0.8,charY+sBounce,sc,'idle');

  // Character name plates
  const tagW=Math.min(W*0.22,80), tagH=Math.min(H*0.032,22);
  for (const [cx2,cy2,name,col,bg] of [
    [W*0.2,charY+kBounce+68*sc,'KAI','#ff6644','rgba(120,0,0,0.75)'],
    [W*0.8,charY+sBounce+68*sc,'SHADOW','#44ff88','rgba(0,80,0,0.75)']
  ]) {
    ctx.fillStyle=bg;
    ctx.beginPath(); ctx.roundRect(cx2-tagW/2,cy2-tagH*0.75,tagW,tagH,4); ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.roundRect(cx2-tagW/2,cy2-tagH*0.75,tagW,tagH,4); ctx.stroke();
    ctx.fillStyle=col; ctx.font=`bold ${Math.min(tagH*0.72,14)}px Arial,sans-serif`;
    ctx.textAlign='center'; ctx.fillText(name,cx2,cy2-tagH*0.75+tagH*0.72);
  }

  // High score
  const bestMed=getBestScore(1);
  if (bestMed!==null) {
    const hsY=H*0.76;
    const hsW=Math.min(W*0.52,200), hsH=Math.min(H*0.038,26);
    ctx.fillStyle='rgba(0,0,0,0.55)';
    ctx.beginPath(); ctx.roundRect(W/2-hsW/2,hsY-hsH*0.82,hsW,hsH,5); ctx.fill();
    ctx.strokeStyle='rgba(255,200,60,0.45)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(W/2-hsW/2,hsY-hsH*0.82,hsW,hsH,5); ctx.stroke();
    ctx.fillStyle='#ffcc44'; ctx.font=`bold ${Math.min(W*0.036,14)}px Arial,sans-serif`;
    ctx.textAlign='center'; ctx.shadowColor='#ffaa00'; ctx.shadowBlur=6;
    ctx.fillText(`HI-SCORE  ${bestMed}`,W/2,hsY); ctx.shadowBlur=0;
  }

  // TAP TO START blinking
  if (Math.floor(blinkTimer*1.8)%2===0) {
    const tapY=H*0.86;
    const tapSize=Math.min(W*0.058,26);
    ctx.font=`bold ${tapSize}px 'Arial Black',Impact,sans-serif`;

let selectedChar=0, csHighlight=0;

function getCharSelLayout() {
  const W=canvas.width, H=canvas.height;
  // Cards fill most of the available vertical space between title and bottom bar
  const gW=Math.min(W*0.94,500);
  const cW=gW/2;
  // Taller cards so the character sprite has more room; leave space for title (H*0.18) and bottom info (H*0.14)
  const availH=H*(1-0.18-0.16);
  const cH=Math.min(cW*1.22, availH/2);
  const sX=W/2-gW/2, sY=H*0.18;
  return {gW,cW,cH,sX,sY};
}

function drawCharSel(dt) {
  csHighlight+=dt*3;
  const W=canvas.width, H=canvas.height;

  // Background — deep indigo with subtle radial centre glow
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#030016'); bg.addColorStop(1,'#0e0028');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  const midGlow=ctx.createRadialGradient(W/2,H*0.5,0,W/2,H*0.5,W*0.55);
  midGlow.addColorStop(0,'rgba(60,20,120,0.22)'); midGlow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=midGlow; ctx.fillRect(0,0,W,H);

  // Title
  const titleSize=Math.min(W*0.068,32);
  ctx.textAlign='center';
  ctx.font=`bold ${titleSize}px 'Arial Black',Impact,sans-serif`;
  ctx.strokeStyle='rgba(0,0,0,0.9)'; ctx.lineWidth=titleSize*0.1; ctx.lineJoin='round';
  ctx.strokeText('SELECT YOUR FIGHTER',W/2,H*0.115);
  ctx.shadowColor='#ffaa00'; ctx.shadowBlur=16;
  const titleGrad=ctx.createLinearGradient(0,H*0.06,0,H*0.13);
  titleGrad.addColorStop(0,'#ffffff'); titleGrad.addColorStop(0.5,'#ffee66'); titleGrad.addColorStop(1,'#ff9900');
  ctx.fillStyle=titleGrad; ctx.fillText('SELECT YOUR FIGHTER',W/2,H*0.115);
  ctx.shadowBlur=0;

  const {cW,cH,sX,sY}=getCharSelLayout();
  const pos=[[0,0],[1,0],[0,1],[1,1]];
  // Per-character gem border colours matching PAL accent colours
  const gemColors=['#ff2244','#3399ff','#ffcc00','#22dd55'];
  const gemDark=['rgba(80,0,0,0.82)','rgba(0,10,70,0.82)','rgba(60,30,0,0.82)','rgba(0,40,10,0.82)'];
  const charDescs=[
    'Fire  |  Balanced',
    'Ice  |  Combo King',
    'Thunder  |  Aggressive',
    'Dark  |  Power Surge'
  ];
  const pad=6;

  for (let i=0;i<4;i++) {
    const [gx,gy]=pos[i];
    const cardX=sX+gx*cW+pad, cardY=sY+gy*cH+pad;
    const cardW2=cW-pad*2, cardH2=cH-pad*2;
    const cx2=cardX+cardW2/2, cy2=cardY+cardH2/2;
    const sel=i===selectedChar;
    const pulse=sel?(0.7+0.3*Math.sin(csHighlight)):0;
    const colHex=gemColors[i];

    // Card background with character-themed dark fill
    ctx.fillStyle=gemDark[i];
    ctx.beginPath(); ctx.roundRect(cardX,cardY,cardW2,cardH2,10); ctx.fill();

    // Inner gradient overlay (bottom dark to transparent)
    const innerGrad=ctx.createLinearGradient(cardX,cardY,cardX,cardY+cardH2);
    innerGrad.addColorStop(0,'rgba(0,0,0,0)'); innerGrad.addColorStop(1,'rgba(0,0,0,0.45)');
    ctx.fillStyle=innerGrad;
    ctx.beginPath(); ctx.roundRect(cardX,cardY,cardW2,cardH2,10); ctx.fill();

    // Border: selected = bright thick animated glow, unselected = dim colour border
    if (sel) {
      ctx.shadowColor=colHex; ctx.shadowBlur=20*pulse;
      ctx.strokeStyle=colHex; ctx.lineWidth=3;
    } else {
      ctx.shadowBlur=0;
      ctx.strokeStyle=`rgba(${i===0?'180,40,40':i===1?'40,80,200':i===2?'180,140,0':'30,140,50'},0.5)`;
      ctx.lineWidth=1.8;
    }
    ctx.beginPath(); ctx.roundRect(cardX,cardY,cardW2,cardH2,10); ctx.stroke();

    // Selected: animated ring drawn on top
    if (sel) {
      ctx.save();

      ctx.lineWidth=1.2;
      ctx.setLineDash([6,5]);
      ctx.beginPath(); ctx.roundRect(cardX+3,cardY+3,cardW2-6,cardH2-6,8); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    // Small gem diamond in top-right corner
    const gSize=Math.min(cardW2*0.1,14);
    const gx2=cardX+cardW2-gSize-6, gy2=cardY+gSize+6;
    ctx.fillStyle=colHex;

    ctx.lineTo(gx2,gy2+gSize); ctx.lineTo(gx2-gSize*0.6,gy2); ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;

    // Character sprite — larger when selected
    const baseSc=cardW2/190;
    const sprSc=sel?baseSc*1.14:baseSc;
    const sprY=cy2-cardH2*0.1;
    drawCharacter(i,cx2,sprY,sprSc,'idle');

    // Name plate at bottom of card
    const plateH=Math.min(cardH2*0.18,28);
    const plateY=cardY+cardH2-plateH;
    ctx.fillStyle=sel
      ? `rgba(${i===0?'160,0,0':i===1?'0,20,140':i===2?'140,90,0':'0,110,20'},0.88)`
      : 'rgba(0,0,0,0.6)';
    ctx.beginPath(); ctx.roundRect(cardX,plateY,cardW2,plateH,{lowerLeft:10,lowerRight:10,upperLeft:0,upperRight:0}); ctx.fill();
    if (sel) {
      ctx.strokeStyle=colHex; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.roundRect(cardX,plateY,cardW2,plateH,{lowerLeft:10,lowerRight:10,upperLeft:0,upperRight:0}); ctx.stroke();
    }
    const nameSize=Math.min(cardW2*0.13,16);
    ctx.font=`bold ${nameSize}px 'Arial Black',Arial,sans-serif`;
    ctx.fillStyle=sel?'#ffffff':colHex;
    ctx.textAlign='center';
    if (sel) { ctx.shadowColor=colHex; ctx.shadowBlur=8; }
    ctx.fillText(CHAR_NAMES[i],cx2,plateY+plateH*0.72);
    ctx.shadowBlur=0;
  }

  // Bottom info bar for selected character
  const infoY=sY+cH*2+pad*2+Math.min(H*0.02,10);
  const gcn=['Red Gems  —  Fire Style','Blue Gems  —  Ice Style','Yellow Gems  —  Thunder Style','Green Gems  —  Dark Style'];
  const infoW=Math.min(W*0.88,380), infoH=Math.min(H*0.056,38);
  ctx.fillStyle='rgba(0,0,0,0.55)';

  ctx.strokeStyle=`rgba(${selectedChar===0?'200,40,40':selectedChar===1?'40,80,200':selectedChar===2?'180,140,0':'30,160,60'},0.5)`;
  ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.roundRect(W/2-infoW/2,infoY,infoW,infoH,6); ctx.stroke();

  ctx.fillStyle=gemColors[selectedChar];
  ctx.font=`bold ${Math.min(W*0.04,15)}px Arial,sans-serif`;
  ctx.textAlign='center';
  ctx.shadowColor=gemColors[selectedChar]; ctx.shadowBlur=6;
  ctx.fillText(`${CHAR_NAMES[selectedChar]}  •  ${gcn[selectedChar]}`,W/2,infoY+infoH*0.66);
  ctx.shadowBlur=0;

  ctx.fillStyle='rgba(150,150,180,0.6)'; ctx.font=`${Math.min(W*0.032,12)}px Arial,sans-serif`;
  ctx.fillText('Tap card to select  •  Arrow keys to navigate',W/2,infoY+infoH+Math.min(H*0.022,16));
}

  const stageColors=[
    ['#1a0000','#3a0000'],  // KAI  - deep crimson
    ['#000018','#00003a'],  // MEI  - midnight blue
    ['#1a0e00','#3a1e00'],  // RIKU - dark amber
    ['#000a00','#001800'],  // SHADOW - forest black
  ];
  const [pDark,pMid]=stageColors[playerChar];
  const [cDark,cMid]=stageColors[cpuChar];

  // Left half gradient (player stage)
  const pGrad=ctx.createLinearGradient(0,0,W/2,H);
  pGrad.addColorStop(0,pMid); pGrad.addColorStop(1,pDark);
  ctx.fillStyle=pGrad; ctx.fillRect(0,0,W/2,H);

  // Right half gradient (cpu stage)
  const cGrad=ctx.createLinearGradient(W/2,0,W,H);
  cGrad.addColorStop(0,cMid); cGrad.addColorStop(1,cDark);
  ctx.fillStyle=cGrad; ctx.fillRect(W/2,0,W/2,H);

  // Diagonal light sweep on each side
  const sweepProgress=Math.min(1,(2500-vsTimer)/2500);
  ctx.save();
  ctx.globalAlpha=0.07*Math.max(0,1-sweepProgress*2);
  ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(W*0.35,0); ctx.lineTo(W*0.15,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(W,0); ctx.lineTo(W*0.65,0); ctx.lineTo(W*0.85,H); ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  ctx.restore();

  // Particle-like scanlines inside each half
  ctx.save(); ctx.globalAlpha=0.04; ctx.fillStyle='#ffffff';
  for (let ly=0;ly<H;ly+=3) ctx.fillRect(0,ly,W,1);
  ctx.restore();

  // Centre split: dramatic lightning-bolt divider
  const splitPulse=0.55+0.45*Math.abs(Math.sin(vsFlash*0.5));
  ctx.save();
  ctx.shadowColor='#ffffff'; ctx.shadowBlur=18*splitPulse;
  ctx.strokeStyle=`rgba(255,255,255,${splitPulse})`; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke();
  ctx.restore();

  // PLAYER banner (top-left)
  const bannerH=Math.min(H*0.065,40);
  ctx.fillStyle='rgba(0,0,0,0.62)';
  ctx.beginPath(); ctx.roundRect(W*0.02,H*0.04,W*0.44,bannerH,5); ctx.fill();
  ctx.strokeStyle='rgba(255,220,80,0.55)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.roundRect(W*0.02,H*0.04,W*0.44,bannerH,5); ctx.stroke();
  ctx.fillStyle='#ffee44'; ctx.font=`bold ${Math.min(W*0.048,20)}px Arial,sans-serif`;
  ctx.textAlign='center'; ctx.shadowColor='#ffaa00'; ctx.shadowBlur=8;
  ctx.fillText('PLAYER 1',W*0.24,H*0.04+bannerH*0.7); ctx.shadowBlur=0;

  // CPU banner (top-right)
  ctx.fillStyle='rgba(0,0,0,0.62)';
  ctx.beginPath(); ctx.roundRect(W*0.54,H*0.04,W*0.44,bannerH,5); ctx.fill();
  ctx.strokeStyle='rgba(100,180,255,0.55)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.roundRect(W*0.54,H*0.04,W*0.44,bannerH,5); ctx.stroke();
  ctx.fillStyle='#88ccff'; ctx.font=`bold ${Math.min(W*0.048,20)}px Arial,sans-serif`;
  ctx.shadowColor='#2266ff'; ctx.shadowBlur=8;
  ctx.fillText('CPU',W*0.76,H*0.04+bannerH*0.7); ctx.shadowBlur=0;

  // Characters — large scale, facing each other
  const sc=Math.min(W,H)/230;
  // Player drawn normally (faces right by default)
  drawCharacter(playerChar,W*0.24,H*0.52,sc,'idle');
  // CPU mirrored to face left
  ctx.save(); ctx.translate(W,0); ctx.scale(-1,1);
  drawCharacter(cpuChar,W-W*0.24,H*0.52,sc,'idle');
  ctx.restore();

  // Character glow auras behind sprites
  const pcAura=ctx.createRadialGradient(W*0.24,H*0.52,0,W*0.24,H*0.52,85*sc);
  pcAura.addColorStop(0,`${getCharBg(playerChar)}88`); pcAura.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=0.55; ctx.fillStyle=pcAura;
  ctx.beginPath(); ctx.arc(W*0.24,H*0.52,85*sc,0,Math.PI*2); ctx.fill();
  const ccAura=ctx.createRadialGradient(W*0.76,H*0.52,0,W*0.76,H*0.52,85*sc);
  ccAura.addColorStop(0,`${getCharBg(cpuChar)}88`); ccAura.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=ccAura;
  ctx.beginPath(); ctx.arc(W*0.76,H*0.52,85*sc,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;

  // Character name plates at bottom
  const namePlateH=Math.min(H*0.055,34);
  const namePlateY=H*0.84;
  for (const [nx,name,col,bdr] of [
    [W*0.24, CHAR_NAMES[playerChar], '#ffffff', 'rgba(255,200,80,0.6)'],
    [W*0.76, CHAR_NAMES[cpuChar],   '#ffffff', 'rgba(100,180,255,0.6)']
  ]) {
    const npW=Math.min(W*0.36,160);
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.beginPath(); ctx.roundRect(nx-npW/2,namePlateY,npW,namePlateH,5); ctx.fill();
    ctx.strokeStyle=bdr; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(nx-npW/2,namePlateY,npW,namePlateH,5); ctx.stroke();
    ctx.fillStyle=col; ctx.font=`bold ${Math.min(W*0.052,22)}px 'Arial Black',Impact,sans-serif`;
    ctx.textAlign='center'; ctx.shadowColor='rgba(0,0,0,0.8)'; ctx.shadowBlur=4;
    ctx.fillText(name,nx,namePlateY+namePlateH*0.74); ctx.shadowBlur=0;
  }

  // VS text — massive, pulsing, dramatic
  const vsSize=Math.min(W*0.2,100);
  const vsPulse=1+0.08*Math.sin(vsFlash*1.2);
  ctx.save();
  ctx.translate(W/2,H*0.48);
  ctx.scale(vsPulse,vsPulse);
  ctx.textAlign='center';
  ctx.font=`bold ${vsSize}px 'Arial Black',Impact,sans-serif`;
  // Multi-layer VS
  ctx.fillStyle='rgba(0,0,0,0.85)';
  ctx.fillText('VS',4,6);
  ctx.shadowColor='#ff2200'; ctx.shadowBlur=40+15*Math.sin(vsFlash);
  ctx.fillStyle='rgba(255,40,0,0.5)'; ctx.fillText('VS',0,0);
  ctx.shadowColor='#ffaa00'; ctx.shadowBlur=22;
  ctx.fillStyle='rgba(255,160,0,0.3)'; ctx.fillText('VS',0,0);
  ctx.shadowBlur=0;
  const vsGrad=ctx.createLinearGradient(0,-vsSize,0,vsSize*0.2);
  vsGrad.addColorStop(0,'#ffffff'); vsGrad.addColorStop(0.35,'#ffe066');
  vsGrad.addColorStop(0.7,'#ff8800'); vsGrad.addColorStop(1,'#ff2200');
  ctx.fillStyle=vsGrad; ctx.fillText('VS',0,0);
  ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=vsSize*0.025; ctx.lineJoin='round';
  ctx.strokeText('VS',0,0);
  ctx.restore();

  // Flash-in transition at start
  const flashAlpha=Math.max(0,1.0-((2500-vsTimer)/800));
  if (flashAlpha>0) {
    ctx.fillStyle=`rgba(255,255,255,${flashAlpha*0.8})`;
    ctx.fillRect(0,0,W,H);
  }

  if (vsTimer<=0) setState(S.GAME);
}

function getCharBg(idx) { return ['#330000','#000033','#332200','#001a00'][idx]; }

// ============================================================
// ARCADE ROUND SCREEN
// ============================================================
function drawArcade(dt) {
  const W=canvas.width, H=canvas.height;
  const t=arcadeRoundTimer;

  // Dark gradient background
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a0010'); bg.addColorStop(1,'#000008');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // Radial glow center
  const arcGlow=ctx.createRadialGradient(W/2,H*0.45,0,W/2,H*0.45,Math.min(W,H)*0.6);
  arcGlow.addColorStop(0,'rgba(80,20,180,0.28)'); arcGlow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=arcGlow; ctx.fillRect(0,0,W,H);

  // Scanlines
  ctx.save(); ctx.globalAlpha=0.04; ctx.fillStyle='#000';
  for (let ly=0;ly<H;ly+=3) ctx.fillRect(0,ly,W,1);
  ctx.restore();

  // Progress dots
  const dotY=H*0.12;
  const dotR=Math.min(W*0.022,10);
  const dotGap=dotR*3;
  const dotsStartX=W/2-(1.5*dotGap);
  for (let d=0;d<4;d++) {
    const ddx=dotsStartX+d*dotGap;
    const filled=d<=arcadeRound;
    ctx.save();
    ctx.fillStyle=filled?'#ffcc00':'rgba(255,255,255,0.2)';
    if (filled) { ctx.shadowColor='#ffcc00'; ctx.shadowBlur=10; }
    ctx.beginPath(); ctx.arc(ddx,dotY,dotR,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.restore();
  }
  ctx.fillStyle='rgba(200,180,100,0.7)'; ctx.font=`bold ${Math.min(W*0.028,11)}px Arial,sans-serif`;
  ctx.textAlign='center';
  ctx.fillText(`ROUND ${arcadeRound+1} OF 4`, W/2, dotY+dotR*2.2);

  // Big ROUND N text
  const roundSize=Math.min(W*0.16,72);
  const roundY=H*0.3;
  ctx.textAlign='center';
  ctx.font=`bold ${roundSize}px 'Arial Black',Impact,sans-serif`;
  ctx.strokeStyle='rgba(0,0,0,0.9)'; ctx.lineWidth=roundSize*0.08; ctx.lineJoin='round';
  ctx.strokeText(`ROUND ${arcadeRound+1}`, W/2, roundY);
  ctx.shadowColor='#ff8800'; ctx.shadowBlur=32+12*Math.sin(t*4);
  ctx.fillStyle='rgba(255,120,0,0.45)'; ctx.fillText(`ROUND ${arcadeRound+1}`, W/2, roundY);
  const arcRg=ctx.createLinearGradient(0,roundY-roundSize,0,roundY+roundSize*0.2);
  arcRg.addColorStop(0,'#ffffff'); arcRg.addColorStop(0.3,'#ffee88'); arcRg.addColorStop(0.7,'#ffaa00'); arcRg.addColorStop(1,'#ff5500');
  ctx.shadowColor='#ffcc00'; ctx.shadowBlur=20;
  ctx.fillStyle=arcRg; ctx.fillText(`ROUND ${arcadeRound+1}`, W/2, roundY);
  ctx.shadowBlur=0;

  // Characters on left and right
  const arcSc=Math.min(W,H)/340;
  const charY=H*0.6;
  const px=W*0.22, ex=W*0.78;
  const opponent=arcadeOpponents[arcadeRound]!==undefined?arcadeOpponents[arcadeRound]:cpuChar;

  // Player aura
  const pAura=ctx.createRadialGradient(px,charY,0,px,charY,60*arcSc);
  pAura.addColorStop(0,PAL[CHAR_COLORS[playerChar]][3]+'66'); pAura.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=pAura; ctx.beginPath(); ctx.arc(px,charY,60*arcSc,0,Math.PI*2); ctx.fill();
  drawCharacter(playerChar,px,charY,arcSc,'idle');

  // CPU aura
  const eAura=ctx.createRadialGradient(ex,charY,0,ex,charY,60*arcSc);
  eAura.addColorStop(0,PAL[CHAR_COLORS[opponent]][3]+'66'); eAura.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=eAura; ctx.beginPath(); ctx.arc(ex,charY,60*arcSc,0,Math.PI*2); ctx.fill();
  ctx.save(); ctx.translate(W,0); ctx.scale(-1,1);
  drawCharacter(opponent,W-ex,charY,arcSc,'idle');
  ctx.restore();

  // Name plates
  const npW=Math.min(W*0.26,90), npH=Math.min(H*0.04,22);
  const npY=charY+70*arcSc;
  for (const [nx,name,col] of [[px,CHAR_NAMES[playerChar],'#ffdd88'],[ex,CHAR_NAMES[opponent],'#88ccff']]) {
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.beginPath(); ctx.roundRect(nx-npW/2,npY,npW,npH,4); ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.roundRect(nx-npW/2,npY,npW,npH,4); ctx.stroke();
    ctx.fillStyle=col; ctx.font=`bold ${Math.min(npH*0.68,13)}px Arial,sans-serif`;
    ctx.textAlign='center'; ctx.shadowColor=col; ctx.shadowBlur=6;
    ctx.fillText(name,nx,npY+npH*0.72); ctx.shadowBlur=0;
  }

  // VS in center
  const arcVsSize=Math.min(W*0.13,56);
  const arcVsPulse=1+0.06*Math.sin(t*5);
  ctx.save(); ctx.translate(W/2,H*0.6); ctx.scale(arcVsPulse,arcVsPulse);
  ctx.textAlign='center';
  ctx.font=`bold ${arcVsSize}px 'Arial Black',Impact,sans-serif`;
  ctx.fillStyle='rgba(0,0,0,0.8)'; ctx.fillText('VS',3,4);
  ctx.shadowColor='#ff2200'; ctx.shadowBlur=28;
  const arcVsGr=ctx.createLinearGradient(0,-arcVsSize,0,arcVsSize*0.2);
  arcVsGr.addColorStop(0,'#ffffff'); arcVsGr.addColorStop(0.4,'#ffee44'); arcVsGr.addColorStop(1,'#ff8800');
  ctx.fillStyle=arcVsGr; ctx.fillText('VS',0,0);
  ctx.shadowBlur=0; ctx.restore();

  // Progress bar at bottom showing time until fight
  const arcBarW=Math.min(W*0.6,240), arcBarH=6;
  const arcBarX=(W-arcBarW)/2, arcBarY=H*0.9;
  const arcPct=Math.min(t/2.5,1);
  ctx.fillStyle='rgba(255,255,255,0.1)';
  ctx.beginPath(); ctx.roundRect(arcBarX,arcBarY,arcBarW,arcBarH,3); ctx.fill();
  ctx.fillStyle='#ffcc00';
  ctx.shadowColor='#ffcc00'; ctx.shadowBlur=8;
  ctx.beginPath(); ctx.roundRect(arcBarX,arcBarY,arcBarW*arcPct,arcBarH,3); ctx.fill();
  ctx.shadowBlur=0;

  ctx.fillStyle='rgba(200,200,200,0.5)'; ctx.font=`${Math.min(W*0.028,11)}px Arial,sans-serif`;
  ctx.textAlign='center'; ctx.fillText('GET READY!',W/2,arcBarY-6);
}

// ============================================================
// ARCADE VICTORY SCREEN
// ============================================================
function drawArcadeEnd(dt) {
  resultTimer+=dt;
  const W=canvas.width, H=canvas.height;
  const t=resultTimer;

  // Animated dark background with hue shift
  const hue1=(t*30)%360, hue2=(t*30+120)%360;
  const aeBg=ctx.createLinearGradient(0,0,W,H);
  aeBg.addColorStop(0,`hsl(${hue1},60%,8%)`);
  aeBg.addColorStop(0.5,`hsl(${hue2},50%,6%)`);
  aeBg.addColorStop(1,`hsl(${hue1},60%,8%)`);
  ctx.fillStyle=aeBg; ctx.fillRect(0,0,W,H);

  // Radial gold burst
  const aeR=Math.min(W,H)*0.55;
  const aeBurst=ctx.createRadialGradient(W/2,H*0.48,0,W/2,H*0.48,aeR);
  aeBurst.addColorStop(0,`rgba(255,200,0,${0.14+0.07*Math.sin(t*2.5)})`);
  aeBurst.addColorStop(0.5,`rgba(255,120,0,${0.07+0.04*Math.sin(t*2)})`);
  aeBurst.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=aeBurst; ctx.fillRect(0,0,W,H);

  // Rotating starburst rays
  ctx.save(); ctx.translate(W/2,H*0.48); ctx.rotate(t*0.25);
  for (let ri=0;ri<16;ri++) {
    const ang=(ri/16)*Math.PI*2;
    const rLen=Math.min(W,H)*0.45;
    ctx.save(); ctx.rotate(ang);
    const aeRay=ctx.createLinearGradient(0,0,0,-rLen);
    aeRay.addColorStop(0,'rgba(255,200,0,0.14)'); aeRay.addColorStop(1,'rgba(255,200,0,0)');
    ctx.fillStyle=aeRay;
    ctx.beginPath(); ctx.moveTo(-rLen*0.03,0); ctx.lineTo(0,-rLen); ctx.lineTo(rLen*0.03,0); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // Confetti
  for (const c of confetti) {
    c.x+=c.vx; c.y+=c.vy; c.rot+=c.rotV;
    if (c.y>H+20) { c.y=-20; c.x=Math.random()*W; }
    ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot);
    ctx.globalAlpha=0.85; ctx.fillStyle=c.color;
    ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);
    ctx.globalAlpha=1; ctx.restore();
  }

  // Player character celebrating large
  const aeSc=Math.min(W,H)/200;
  const aeBounce=Math.abs(Math.sin(t*2.8))*9*aeSc;
  drawCharacter(playerChar,W/2,H*0.52-aeBounce,aeSc*1.6,'celebrate');

  // CHAMPION! text
  const aeMainSize=Math.min(W*0.14,65);
  const aeMainY=H*0.13;
  ctx.textAlign='center';
  ctx.font=`bold ${aeMainSize}px 'Arial Black',Impact,sans-serif`;
  ctx.strokeStyle='rgba(0,0,0,0.9)'; ctx.lineWidth=aeMainSize*0.1; ctx.lineJoin='round';
  ctx.strokeText('CHAMPION!',W/2,aeMainY);
  ctx.shadowColor='#ff8800'; ctx.shadowBlur=44+18*Math.sin(t*3);
  ctx.fillStyle='rgba(255,120,0,0.5)'; ctx.fillText('CHAMPION!',W/2,aeMainY);
  ctx.shadowColor='#ffff00'; ctx.shadowBlur=24;
  ctx.fillStyle='rgba(255,240,0,0.35)'; ctx.fillText('CHAMPION!',W/2,aeMainY);
  ctx.shadowBlur=0;
  const aeShimmer=(Math.sin(t*2.2)+1)*0.5;
  const aeCg=ctx.createLinearGradient(W/2-aeMainSize*2.5,aeMainY-aeMainSize,W/2+aeMainSize*2.5,aeMainY+aeMainSize*0.2);
  aeCg.addColorStop(Math.max(0,aeShimmer-0.18),'#cc8800');
  aeCg.addColorStop(aeShimmer,'#ffffff');
  aeCg.addColorStop(Math.min(1,aeShimmer+0.18),'#ffdd00');
  aeCg.addColorStop(1,'#ff8800');
  ctx.fillStyle=aeCg; ctx.shadowColor='#ffcc00'; ctx.shadowBlur=16;
  ctx.fillText('CHAMPION!',W/2,aeMainY); ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=aeMainSize*0.025;
  ctx.strokeText('CHAMPION!',W/2,aeMainY);

  // Total score panel
  const aePanelW=Math.min(W*0.78,320), aePanelH=Math.min(H*0.1,58);
  const aePanelX=W/2-aePanelW/2, aePanelY=H*0.22;
  ctx.fillStyle='rgba(0,0,0,0.65)';
  ctx.beginPath(); ctx.roundRect(aePanelX,aePanelY,aePanelW,aePanelH,8); ctx.fill();
  ctx.strokeStyle='rgba(255,200,0,0.6)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(aePanelX,aePanelY,aePanelW,aePanelH,8); ctx.stroke();
  ctx.fillStyle='rgba(200,175,100,0.75)'; ctx.font=`${Math.min(W*0.03,11)}px Arial,sans-serif`;
  ctx.textAlign='center'; ctx.fillText('TOTAL SCORE',W/2,aePanelY+aePanelH*0.36);
  ctx.font=`bold ${Math.min(W*0.06,26)}px 'Arial Black',Arial,sans-serif`;
  ctx.fillStyle='#ffee44'; ctx.shadowColor='#ffcc00'; ctx.shadowBlur=10;
  ctx.fillText(arcadeScoreTotal,W/2,aePanelY+aePanelH*0.84); ctx.shadowBlur=0;

  // Arcade cleared badge
  ctx.fillStyle='rgba(255,200,0,0.9)'; ctx.font=`bold ${Math.min(W*0.042,17)}px Arial,sans-serif`;
  ctx.textAlign='center'; ctx.shadowColor='#ffaa00'; ctx.shadowBlur=12;
  ctx.fillText('ARCADE CLEARED!',W/2,aePanelY+aePanelH+Math.min(H*0.05,28)); ctx.shadowBlur=0;

  // TAP TO CONTINUE blinking
  if (Math.floor(t*1.8)%2===0) {
    const aeTapY=H*0.88;
    const aeTapSize=Math.min(W*0.048,20);
    ctx.font=`bold ${aeTapSize}px 'Arial Black',Impact,sans-serif`;
    ctx.textAlign='center';
    ctx.strokeStyle='rgba(0,0,0,0.85)'; ctx.lineWidth=aeTapSize*0.1; ctx.lineJoin='round';
    ctx.strokeText('TAP TO CONTINUE',W/2,aeTapY);
    ctx.shadowColor='#ffff44'; ctx.shadowBlur=12+4*Math.sin(t*3);
    const aeTg=ctx.createLinearGradient(0,aeTapY-aeTapSize,0,aeTapY+4);
    aeTg.addColorStop(0,'#ffffff'); aeTg.addColorStop(0.5,'#ffee88'); aeTg.addColorStop(1,'#ffcc00');
    ctx.fillStyle=aeTg; ctx.fillText('TAP TO CONTINUE',W/2,aeTapY); ctx.shadowBlur=0;
  }
}

// ============================================================
// DIFFICULTY SELECT SCREEN
// ============================================================
let diffHighlight=0;

function getDiffCardLayout() {
  const W=canvas.width, H=canvas.height;
  const totalW=Math.min(W*0.95,540);
  const gap=Math.min(W*0.018,10);
  const cardW=(totalW-gap*2)/3;
  // Cards occupy middle band; leave room for title (~H*0.2) and footer (~H*0.12)
  const cardH=Math.min(cardW*1.45, H*(1-0.22-0.14));
  const startX=(W-totalW)/2;
  const startY=H*0.22;
  return {cardW,cardH,startX,startY,totalW,gap};
}

function drawDiff(dt) {
  diffHighlight+=dt*3;
  const W=canvas.width, H=canvas.height;

  // Background
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#030016'); bg.addColorStop(1,'#0e0028');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  // Subtle mid glow
  const midGlow=ctx.createRadialGradient(W/2,H*0.55,0,W/2,H*0.55,W*0.6);
  midGlow.addColorStop(0,'rgba(40,10,80,0.2)'); midGlow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=midGlow; ctx.fillRect(0,0,W,H);

  // Title
  const titleSize=Math.min(W*0.065,30);
  ctx.textAlign='center';
  ctx.font=`bold ${titleSize}px 'Arial Black',Impact,sans-serif`;
  ctx.strokeStyle='rgba(0,0,0,0.9)'; ctx.lineWidth=titleSize*0.1; ctx.lineJoin='round';
  ctx.strokeText('SELECT DIFFICULTY',W/2,H*0.14);
  const titleGrad=ctx.createLinearGradient(0,H*0.08,0,H*0.16);
  titleGrad.addColorStop(0,'#ffffff'); titleGrad.addColorStop(0.5,'#ffee66'); titleGrad.addColorStop(1,'#ff9900');
  ctx.fillStyle=titleGrad; ctx.shadowColor='#ffaa00'; ctx.shadowBlur=14;
  ctx.fillText('SELECT DIFFICULTY',W/2,H*0.14); ctx.shadowBlur=0;

  const {cardW,cardH,startX,startY,gap}=getDiffCardLayout();
  const descs=[
    ['Relaxed pace','Forgiving AI','Great for beginners'],
    ['Balanced speed','Competent AI','The real challenge'],
    ['Lightning fast','Ruthless AI','Experts only']
  ];
  // Colour themes per difficulty
  const themes=[
    {col:'#33cc44',dark:'#001800',mid:'rgba(20,80,20,0.88)',bdr:'rgba(40,180,60,0.7)',glow:'#22bb33',starFill:'#33ff55',starEmpty:'#1a4020'},
    {col:'#ffcc00',dark:'#181000',mid:'rgba(80,60,0,0.88)', bdr:'rgba(200,160,0,0.7)',glow:'#ddaa00',starFill:'#ffdd00',starEmpty:'#3a2800'},
    {col:'#ff4444',dark:'#1a0000',mid:'rgba(80,0,0,0.88)',  bdr:'rgba(200,40,40,0.7)',glow:'#ee2222',starFill:'#ff3333',starEmpty:'#3a0000'},
  ];

  for (let i=0;i<3;i++) {
    const ds=DIFF_SETTINGS[i];
    const th=themes[i];
    const cardX=startX+i*(cardW+gap);
    const cx2=cardX+cardW/2;
    const sel=i===difficulty;
    const pulse=sel?(0.7+0.3*Math.sin(diffHighlight)):0;

    // Scale up selected card slightly
    const scaleUp=sel?1.04:1;
    const scaledW=cardW*scaleUp, scaledH=cardH*scaleUp;
    const scaledX=cardX+(cardW-scaledW)/2, scaledY=startY+(cardH-scaledH)/2;

    // Card fill — dark theme colour
    ctx.fillStyle=th.mid;
    ctx.beginPath(); ctx.roundRect(scaledX,scaledY,scaledW,scaledH,12); ctx.fill();

    // Top colour band
    const bandH=scaledH*0.14;
    const bandGrad=ctx.createLinearGradient(scaledX,scaledY,scaledX,scaledY+bandH);
    bandGrad.addColorStop(0,th.col+'cc'); bandGrad.addColorStop(1,th.col+'11');
    ctx.fillStyle=bandGrad;
    ctx.beginPath(); ctx.roundRect(scaledX,scaledY,scaledW,bandH,{upperLeft:12,upperRight:12,lowerLeft:0,lowerRight:0}); ctx.fill();

    // Bottom dark vignette
    const botGrad=ctx.createLinearGradient(scaledX,scaledY+scaledH*0.6,scaledX,scaledY+scaledH);
    botGrad.addColorStop(0,'rgba(0,0,0,0)'); botGrad.addColorStop(1,'rgba(0,0,0,0.5)');
    ctx.fillStyle=botGrad;
    ctx.beginPath(); ctx.roundRect(scaledX,scaledY,scaledW,scaledH,12); ctx.fill();

    // Card border
    if (sel) {
      ctx.shadowColor=th.glow; ctx.shadowBlur=22*pulse;
      ctx.strokeStyle=th.col; ctx.lineWidth=3;
    } else {
      ctx.shadowBlur=0;
      ctx.strokeStyle=th.bdr.replace('0.7','0.35'); ctx.lineWidth=1.5;
    }
    ctx.beginPath(); ctx.roundRect(scaledX,scaledY,scaledW,scaledH,12); ctx.stroke();
    ctx.shadowBlur=0;

    // Selected: animated dashed ring
    if (sel) {
      ctx.save();
      ctx.strokeStyle=`rgba(255,255,255,${0.2+0.15*Math.sin(diffHighlight*1.4)})`;
      ctx.lineWidth=1; ctx.setLineDash([5,4]);
      ctx.beginPath(); ctx.roundRect(scaledX+3,scaledY+3,scaledW-6,scaledH-6,10); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
    }

    // Gem icon in top-left corner
    const gemSz=Math.min(scaledW*0.1,16);
    const gemX=scaledX+gemSz+8, gemY=scaledY+gemSz+8;
    ctx.fillStyle=th.col;
    ctx.shadowColor=th.glow; ctx.shadowBlur=sel?10:4;
    ctx.beginPath(); ctx.moveTo(gemX,gemY-gemSz); ctx.lineTo(gemX+gemSz*0.65,gemY);
    ctx.lineTo(gemX,gemY+gemSz); ctx.lineTo(gemX-gemSz*0.65,gemY); ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;

    // Difficulty name
    const nameSize=Math.min(scaledW*0.19,20);
    ctx.font=`bold ${nameSize}px 'Arial Black',Impact,sans-serif`;
    ctx.textAlign='center';
    ctx.strokeStyle='rgba(0,0,0,0.8)'; ctx.lineWidth=nameSize*0.1; ctx.lineJoin='round';
    ctx.strokeText(ds.name,cx2,scaledY+scaledH*0.2);
    ctx.fillStyle=th.col;
    if (sel) { ctx.shadowColor=th.glow; ctx.shadowBlur=12; }
    ctx.fillText(ds.name,cx2,scaledY+scaledH*0.2);
    ctx.shadowBlur=0;

    // Star rating — drawn as coloured/grey diamonds
    const starCount=3, starFilled=[1,2,3][i];
    const starSz=Math.min(scaledW*0.1,13);
    const starSpacing=starSz*2.4;
    const starsStartX=cx2-(starCount-1)*starSpacing/2;
    const starY=scaledY+scaledH*0.34;
    for (let s=0;s<starCount;s++) {
      const sx=starsStartX+s*starSpacing;
      const filled=s<starFilled;
      ctx.fillStyle=filled?th.starFill:th.starEmpty;
      if (filled && sel) { ctx.shadowColor=th.glow; ctx.shadowBlur=8; }
      ctx.beginPath();
