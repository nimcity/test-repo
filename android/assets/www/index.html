      ctx.moveTo(sx,starY-starSz); ctx.lineTo(sx+starSz*0.6,starY);
      ctx.lineTo(sx,starY+starSz); ctx.lineTo(sx-starSz*0.6,starY); ctx.closePath();
      ctx.fill(); ctx.shadowBlur=0;
      if (filled) {
        ctx.fillStyle='rgba(255,255,255,0.45)';
        ctx.beginPath(); ctx.moveTo(sx-starSz*0.25,starY-starSz*0.7);
        ctx.lineTo(sx+starSz*0.25,starY-starSz*0.7);
        ctx.lineTo(sx,starY-starSz*0.1); ctx.closePath(); ctx.fill();
      }
    }

    // Description lines
    const descSize=Math.min(scaledW*0.1,12);
    ctx.font=`${descSize}px Arial,sans-serif`;
    ctx.fillStyle=sel?'#ffffff':'rgba(180,180,200,0.75)';
    const lineH=descSize*1.55;
    const descStartY=scaledY+scaledH*0.5;
    for (let d=0;d<descs[i].length;d++) {
      ctx.fillText(descs[i][d],cx2,descStartY+d*lineH);
    }

    // Divider line above best score
    const divY=scaledY+scaledH*0.78;
    ctx.strokeStyle=`rgba(${sel?th.col.slice(1).match(/.{2}/g).map(h=>parseInt(h,16)).join(','):'120,120,150'},${sel?0.45:0.2})`;
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(scaledX+scaledW*0.12,divY); ctx.lineTo(scaledX+scaledW*0.88,divY); ctx.stroke();

    // Best score
    const best=getBestScore(i);
    const bsY=scaledY+scaledH*0.9;
    if (best!==null) {
      ctx.fillStyle=sel?'#ffee88':'rgba(200,180,80,0.6)';
      ctx.font=`bold ${Math.min(scaledW*0.1,11)}px Arial,sans-serif`;
      ctx.shadowColor=sel?'#ffcc00':'transparent'; ctx.shadowBlur=sel?6:0;
      ctx.fillText(`BEST  ${best}`,cx2,bsY);
      ctx.shadowBlur=0;
    } else {
      ctx.fillStyle='rgba(120,120,140,0.45)'; ctx.font=`${Math.min(scaledW*0.09,10)}px Arial,sans-serif`;
      ctx.fillText('NO RECORD',cx2,bsY);
    }
  }

  // Footer hint
  ctx.fillStyle='rgba(140,140,170,0.6)'; ctx.font=`${Math.min(W*0.032,12)}px Arial,sans-serif`;
  ctx.textAlign='center';
  ctx.fillText('Tap a card to choose  •  Arrow keys to navigate',W/2,startY+cardH+Math.min(H*0.06,38));

  // ARCADE MODE button
  const arcBtnW=Math.min(W*0.7,280), arcBtnH=44;
  const arcBtnX=(W-arcBtnW)/2;
  const arcBtnY=startY+cardH+Math.min(H*0.06,38)+Math.min(H*0.03,20);
  const arcBtnGrad=ctx.createLinearGradient(arcBtnX,arcBtnY,arcBtnX,arcBtnY+arcBtnH);
  arcBtnGrad.addColorStop(0,'rgba(80,50,0,0.9)'); arcBtnGrad.addColorStop(1,'rgba(40,25,0,0.95)');
  ctx.fillStyle=arcBtnGrad;
  ctx.beginPath(); ctx.roundRect(arcBtnX,arcBtnY,arcBtnW,arcBtnH,8); ctx.fill();
  ctx.strokeStyle='rgba(255,200,0,0.7)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(arcBtnX,arcBtnY,arcBtnW,arcBtnH,8); ctx.stroke();
  const arcBtnTxtSz=Math.min(arcBtnH*0.42,16);
  ctx.font=`bold ${arcBtnTxtSz}px 'Arial Black',Arial,sans-serif`;
  ctx.textAlign='center'; ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.fillText('⚔ ARCADE MODE',W/2+1,arcBtnY+arcBtnH*0.62+1);
  ctx.fillStyle='#ffcc00'; ctx.shadowColor='#ff8800'; ctx.shadowBlur=8;
  ctx.fillText('⚔ ARCADE MODE',W/2,arcBtnY+arcBtnH*0.62); ctx.shadowBlur=0;

  // SURVIVAL button
  const srvBtnW=arcBtnW, srvBtnH=arcBtnH;
  const srvBtnX=arcBtnX;
  const srvBtnY=arcBtnY+arcBtnH+Math.min(H*0.015,10);
  const srvBtnGrad=ctx.createLinearGradient(srvBtnX,srvBtnY,srvBtnX,srvBtnY+srvBtnH);
  srvBtnGrad.addColorStop(0,'rgba(30,0,60,0.9)'); srvBtnGrad.addColorStop(1,'rgba(15,0,35,0.95)');
  ctx.fillStyle=srvBtnGrad;
  ctx.beginPath(); ctx.roundRect(srvBtnX,srvBtnY,srvBtnW,srvBtnH,8); ctx.fill();
  ctx.strokeStyle='rgba(180,80,255,0.7)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(srvBtnX,srvBtnY,srvBtnW,srvBtnH,8); ctx.stroke();
  const srvBtnTxtSz=Math.min(srvBtnH*0.42,16);
  ctx.font=`bold ${srvBtnTxtSz}px 'Arial Black',Arial,sans-serif`;
  ctx.textAlign='center'; ctx.fillStyle='rgba(0,0,0,0.7)';
  ctx.fillText('★ SURVIVAL MODE',W/2+1,srvBtnY+srvBtnH*0.62+1);
  ctx.fillStyle='#cc88ff'; ctx.shadowColor='#9900ff'; ctx.shadowBlur=8;
  ctx.fillText('★ SURVIVAL MODE',W/2,srvBtnY+srvBtnH*0.62); ctx.shadowBlur=0;
}

// ============================================================
// RESIZE
// ============================================================
const FIGHT_STRIP_H = 88; // character fight portraits at top during game

function resize() {
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  const W=canvas.width, H=canvas.height;
  const ctrlH = state===S.GAME ? 148 : 0;
  const topH  = state===S.GAME ? FIGHT_STRIP_H : 0;
  const avail = H - ctrlH - topH - 8;
  if (survivalMode) {
    // Single board centered — can be wider
    const boardPx = Math.min(W*0.7, avail*(COLS/ROWS)*0.92);
    CELL = Math.max(14, Math.floor(boardPx/COLS));
    BW = CELL*COLS; BH = CELL*ROWS;
    LX = Math.max(2,(W-BW)/2); RX = LX+BW+CELL*2;
  } else {
    const boardPx = Math.min(W*0.44, avail*(COLS/ROWS)*0.92);
    CELL = Math.max(14, Math.floor(boardPx/COLS));
    BW = CELL*COLS; BH = CELL*ROWS;
    const totW = BW*2 + CELL*2;
    LX = Math.max(2,(W-totW)/2); RX = LX+BW+CELL*2;
  }
  BY = topH + Math.max(44, (avail-BH)*0.18 + 44);
  if (state===S.TITLE||state===S.CHARSEL||state===S.DIFF) initParticles();
}

// ============================================================
// GEM DRAWING
// ============================================================
function drawGem(x, y, w, h, colorName, type, count) {
  if (type===TP) return; // power gems handled by drawPowerBlock
  const pal=PAL[colorName]||PAL.gray;
  ctx.save();

  if (type===TN) {
    // --- Faceted crystal normal gem ---
    const cx=x+w/2, cy=y+h/2;
    const r=2; // corner radius
    // Clip to gem outline
    ctx.beginPath(); ctx.roundRect(x+1,y+1,w-2,h-2,r); ctx.clip();

    // Top-left quadrant: bright (hit by light)
    const grTL=ctx.createLinearGradient(x,y,cx,cy);
    grTL.addColorStop(0,pal[0]); grTL.addColorStop(1,pal[1]);
    ctx.fillStyle=grTL;
    ctx.beginPath(); ctx.moveTo(x+1,y+1); ctx.lineTo(cx,y+1); ctx.lineTo(cx,cy); ctx.lineTo(x+1,cy); ctx.closePath(); ctx.fill();

    // Top-right quadrant: medium
    const grTR=ctx.createLinearGradient(cx,y,x+w,cy);
    grTR.addColorStop(0,pal[1]); grTR.addColorStop(1,pal[1]);
    ctx.fillStyle=grTR;
    ctx.beginPath(); ctx.moveTo(cx,y+1); ctx.lineTo(x+w-1,y+1); ctx.lineTo(x+w-1,cy); ctx.lineTo(cx,cy); ctx.closePath(); ctx.fill();

    // Bottom-left quadrant: medium-dark
    const grBL=ctx.createLinearGradient(x,cy,cx,y+h);
    grBL.addColorStop(0,pal[1]); grBL.addColorStop(1,pal[2]);
    ctx.fillStyle=grBL;
    ctx.beginPath(); ctx.moveTo(x+1,cy); ctx.lineTo(cx,cy); ctx.lineTo(cx,y+h-1); ctx.lineTo(x+1,y+h-1); ctx.closePath(); ctx.fill();

    // Bottom-right quadrant: darkest (away from light)
    const grBR=ctx.createLinearGradient(cx,cy,x+w,y+h);
    grBR.addColorStop(0,pal[2]); grBR.addColorStop(1,pal[2]);
    ctx.fillStyle=grBR;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x+w-1,cy); ctx.lineTo(x+w-1,y+h-1); ctx.lineTo(cx,y+h-1); ctx.closePath(); ctx.fill();

    // Facet divider lines (cross lines meeting at center)
    ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.lineWidth=0.8;
    ctx.beginPath(); ctx.moveTo(cx,y+1); ctx.lineTo(cx,y+h-1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+1,cy); ctx.lineTo(x+w-1,cy); ctx.stroke();
    // Diagonal bevel lines from corners to center
    ctx.strokeStyle='rgba(255,255,255,0.16)'; ctx.lineWidth=0.6;
    ctx.beginPath(); ctx.moveTo(x+1,y+1); ctx.lineTo(cx,cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+w-1,y+1); ctx.lineTo(cx,cy); ctx.stroke();
    ctx.strokeStyle='rgba(0,0,0,0.18)'; ctx.lineWidth=0.6;
    ctx.beginPath(); ctx.moveTo(x+1,y+h-1); ctx.lineTo(cx,cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+w-1,y+h-1); ctx.lineTo(cx,cy); ctx.stroke();

    // Bright specular highlight dot upper-left
    const sx=x+w*0.28, sy=y+h*0.24, sr=Math.max(1.2,w*0.13);
    const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,sr);
    sg.addColorStop(0,'rgba(255,255,255,0.95)'); sg.addColorStop(0.5,'rgba(255,255,255,0.45)'); sg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(sx,sy,sr,0,Math.PI*2); ctx.fill();
    // Tiny secondary sparkle
    const sx2=x+w*0.62, sy2=y+h*0.18, sr2=Math.max(0.7,w*0.06);
    const sg2=ctx.createRadialGradient(sx2,sy2,0,sx2,sy2,sr2);
    sg2.addColorStop(0,'rgba(255,255,255,0.8)'); sg2.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=sg2; ctx.beginPath(); ctx.arc(sx2,sy2,sr2,0,Math.PI*2); ctx.fill();

    // Restore clip, draw border
    ctx.restore(); ctx.save();
    ctx.strokeStyle=pal[0]; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.roundRect(x+1,y+1,w-2,h-2,r); ctx.stroke();

  } else if (type===TC) {
    // --- Diamond crash gem with internal facets ---
    const cx=x+w/2, cy=y+h/2;
    const dx=x+2, dy=y+2, dw=x+w-2, dh=y+h-2; // diamond corners

    // Clip to diamond shape
    ctx.beginPath(); ctx.moveTo(cx,dy); ctx.lineTo(dw,cy); ctx.lineTo(cx,dh); ctx.lineTo(dx,cy); ctx.closePath(); ctx.clip();

    // Radial gradient: white center fading to deep color
    const rg=ctx.createRadialGradient(cx,cy-h*0.15,0,cx,cy,Math.min(w,h)*0.6);
    rg.addColorStop(0,'#ffffff'); rg.addColorStop(0.22,pal[0]); rg.addColorStop(0.65,pal[1]); rg.addColorStop(1,pal[2]);
    ctx.fillStyle=rg;
    ctx.beginPath(); ctx.moveTo(cx,dy); ctx.lineTo(dw,cy); ctx.lineTo(cx,dh); ctx.lineTo(dx,cy); ctx.closePath(); ctx.fill();

    // Internal facet lines (4 lines from midpoints of edges to center)
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=0.8;
    ctx.beginPath(); ctx.moveTo(cx,dy); ctx.lineTo(cx,cy); ctx.stroke(); // top to center
    ctx.beginPath(); ctx.moveTo(dx,cy); ctx.lineTo(cx,cy); ctx.stroke(); // left to center
    ctx.strokeStyle='rgba(0,0,0,0.22)'; ctx.lineWidth=0.8;
    ctx.beginPath(); ctx.moveTo(dw,cy); ctx.lineTo(cx,cy); ctx.stroke(); // right to center
    ctx.beginPath(); ctx.moveTo(cx,dh); ctx.lineTo(cx,cy); ctx.stroke(); // bottom to center
    // Cross-facet diagonals
    ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=0.6;
    ctx.beginPath(); ctx.moveTo(cx,dy); ctx.lineTo(dw,cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,dy); ctx.lineTo(dx,cy); ctx.stroke();
    ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=0.6;
    ctx.beginPath(); ctx.moveTo(dx,cy); ctx.lineTo(cx,dh); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(dw,cy); ctx.lineTo(cx,dh); ctx.stroke();

    // Bright sparkle highlight near top-left facet
    const hx=cx-Math.min(w,h)*0.18, hy=cy-Math.min(w,h)*0.18, hr=Math.max(1.5,Math.min(w,h)*0.15);
    const hg=ctx.createRadialGradient(hx,hy,0,hx,hy,hr);
    hg.addColorStop(0,'rgba(255,255,255,1)'); hg.addColorStop(0.4,'rgba(255,255,255,0.6)'); hg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(hx,hy,hr,0,Math.PI*2); ctx.fill();

    // Pulsing outer glow (drawn inside clip region as a soft halo)
    const pulseA=0.1+0.09*Math.sin(Date.now()*0.006);
    const pg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(w,h)*0.55);
    pg.addColorStop(0,`rgba(255,255,255,${pulseA})`); pg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=pg;
    ctx.beginPath(); ctx.moveTo(cx,dy); ctx.lineTo(dw,cy); ctx.lineTo(cx,dh); ctx.lineTo(dx,cy); ctx.closePath(); ctx.fill();

    // Sparkle cross lines at highlight point
    ctx.restore(); ctx.save();
    const spLen=Math.max(2,Math.min(w,h)*0.2);
    ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=0.8;
    ctx.beginPath(); ctx.moveTo(hx-spLen,hy); ctx.lineTo(hx+spLen,hy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hx,hy-spLen); ctx.lineTo(hx,hy+spLen); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=0.5;
    ctx.beginPath(); ctx.moveTo(hx-spLen*0.65,hy-spLen*0.65); ctx.lineTo(hx+spLen*0.65,hy+spLen*0.65); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hx+spLen*0.65,hy-spLen*0.65); ctx.lineTo(hx-spLen*0.65,hy+spLen*0.65); ctx.stroke();

    // Diamond border outline
    ctx.strokeStyle=pal[0]; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(cx,dy); ctx.lineTo(dw,cy); ctx.lineTo(cx,dh); ctx.lineTo(dx,cy); ctx.closePath(); ctx.stroke();

  } else { // TK - counter/gray stone block
    const r=2;
    // Diagonal gradient: top-left light to bottom-right dark
    const gr=ctx.createLinearGradient(x,y,x+w,y+h);
    gr.addColorStop(0,PAL.gray[0]); gr.addColorStop(0.4,PAL.gray[1]); gr.addColorStop(1,PAL.gray[2]);
    ctx.fillStyle=gr;
    ctx.beginPath(); ctx.roundRect(x+1,y+1,w-2,h-2,r); ctx.fill();

    // Top highlight strip (raised stone bevel look)
    ctx.fillStyle='rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.roundRect(x+2,y+2,w-4,Math.max(3,h*0.22),r); ctx.fill();

    // Horizontal divider line (heavy stone block seam)
    const midY=y+Math.floor(h/2)+0.5;
    ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=0.8;
    ctx.beginPath(); ctx.moveTo(x+3,midY); ctx.lineTo(x+w-3,midY); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=0.6;
    ctx.beginPath(); ctx.moveTo(x+3,midY+1); ctx.lineTo(x+w-3,midY+1); ctx.stroke();

    // Bottom shadow strip
    ctx.fillStyle='rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.roundRect(x+2,y+h-Math.max(3,h*0.2),w-4,Math.max(3,h*0.18),r); ctx.fill();

    // Gray border with slight inset bevel
    ctx.strokeStyle=PAL.gray[3]; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.roundRect(x+1,y+1,w-2,h-2,r); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.22)'; ctx.lineWidth=0.7;
    ctx.beginPath(); ctx.roundRect(x+2,y+2,w-4,h-4,r); ctx.stroke();

    // Draw countdown number on counter gems
    if (count !== undefined && count > 0) {
      const fontSize = Math.min(w*0.55, 13);
      ctx.font = `bold ${fontSize}px Arial,sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillText(count, x+w/2+1, y+h/2+fontSize*0.38+1);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(count, x+w/2, y+h/2+fontSize*0.38);
    }
  }
  ctx.restore();
}

// ============================================================
// GAME SCREEN
// ============================================================
function drawPowerBlock(x, y, w, h, colorName) {
  const pal=PAL[colorName]||PAL.gray;
  const pad=2, rad=Math.min(10, w*0.13);
  const now=Date.now();
  ctx.save();

  // Outer glowing aura (shadow using accent color)
  ctx.shadowColor=pal[3]; ctx.shadowBlur=18+8*Math.sin(now*0.004);
  // Rich diagonal interior gradient
  const gr=ctx.createLinearGradient(x,y,x+w,y+h);
  gr.addColorStop(0,pal[0]); gr.addColorStop(0.3,pal[1]); gr.addColorStop(0.75,pal[2]); gr.addColorStop(1,pal[2]);
  ctx.fillStyle=gr;
  ctx.beginPath(); ctx.roundRect(x+pad,y+pad,w-pad*2,h-pad*2,rad); ctx.fill();
  ctx.shadowBlur=0;

  // For large blocks render each quadrant slightly differently
  if (w>CELL*2 && h>CELL*2) {
    const cx=x+w/2, cy=y+h/2;
    ctx.save();
    ctx.beginPath(); ctx.roundRect(x+pad,y+pad,w-pad*2,h-pad*2,rad); ctx.clip();
    // TL quadrant: extra bright
    const qTL=ctx.createLinearGradient(x,y,cx,cy);
    qTL.addColorStop(0,'rgba(255,255,255,0.18)'); qTL.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=qTL;
    ctx.fillRect(x+pad,y+pad,(w-pad*2)/2,(h-pad*2)/2);
    // BR quadrant: extra dark
    ctx.fillStyle='rgba(0,0,0,0.12)';
    ctx.fillRect(cx,cy,(w-pad*2)/2,(h-pad*2)/2);
    ctx.restore();
  }

  // Pulsing throbbing border (white/gold alternating with time)
  const borderPulse=0.7+0.3*Math.sin(now*0.007);
  const borderPulse2=0.5+0.5*Math.sin(now*0.007+Math.PI);
  const borderR=Math.floor(255);
  const borderG=Math.floor(200+55*borderPulse2);
  ctx.strokeStyle=`rgba(${borderR},${borderG},180,${borderPulse})`; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.roundRect(x+pad,y+pad,w-pad*2,h-pad*2,rad); ctx.stroke();
  // Inner secondary border glow
  const borderInnerA=0.4+0.3*Math.sin(now*0.007+1.2);
  ctx.strokeStyle=`rgba(255,255,255,${borderInnerA})`; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(x+pad+2,y+pad+2,w-pad*2-4,h-pad*2-4,rad-1); ctx.stroke();

  // White shine strip at top
  ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.roundRect(x+pad+4,y+pad+3,w-pad*2-8,Math.max(4,h*0.22),rad-2); ctx.fill();

  // Subtle inner cell grid lines
  ctx.strokeStyle='rgba(0,0,0,0.18)'; ctx.lineWidth=0.7;
  for(let gx=CELL;gx<w-pad;gx+=CELL){ctx.beginPath();ctx.moveTo(x+gx,y+pad+2);ctx.lineTo(x+gx,y+h-pad-2);ctx.stroke();}
  for(let gy=CELL;gy<h-pad;gy+=CELL){ctx.beginPath();ctx.moveTo(x+pad+2,y+gy);ctx.lineTo(x+w-pad-2,y+gy);ctx.stroke();}

  // Pulsing central radial glow
  const pgCx=x+w/2, pgCy=y+h/2, pgR=Math.min(w,h)*0.5;
  const pgAlpha=0.18+0.14*Math.sin(now*0.005);
  const prg=ctx.createRadialGradient(pgCx,pgCy,0,pgCx,pgCy,pgR);
  prg.addColorStop(0,`rgba(255,255,255,${pgAlpha*1.6})`);
  prg.addColorStop(0.5,`rgba(255,255,255,${pgAlpha*0.6})`);
  prg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=prg;
  ctx.beginPath(); ctx.roundRect(x+pad,y+pad,w-pad*2,h-pad*2,rad); ctx.fill();

  ctx.restore();
}

function drawBoard(bi, ox, oy) {
  const board=boards[bi];
  const charIdx=bi===0?playerChar:cpuChar;
  const charCol=getCharBg(charIdx);
  // Derive accent colors from the character's palette for highlights/borders
  const accentPal=PAL[CHAR_COLORS[charIdx]]||PAL.gray;
  const accentBright=accentPal[0];   // bright highlight
  const accentBorder=accentPal[3];   // vivid accent/border

  // ── Incoming attack counter (above board) ────────────────────
  const buf=attackBuffer[bi];
  if (buf>0) {
    const now=Date.now();
    const gemSz=Math.min(CELL*0.62,14);
    const gemGap=3;
    const maxVisible=Math.min(buf,COLS);
    const totalW=maxVisible*(gemSz+gemGap)-gemGap;
    const dy=oy-gemSz-6;

    for (let i=0;i<maxVisible;i++) {
      const pulse=0.65+0.35*Math.sin(now*0.012+i*0.9);
      const gx=ox+(BW-totalW)/2+i*(gemSz+gemGap);
      ctx.save();
      ctx.shadowColor='#ff2200'; ctx.shadowBlur=8*pulse;
      const gr=ctx.createLinearGradient(gx,dy,gx,dy+gemSz);
      gr.addColorStop(0,'rgba(255,'+Math.floor(80*pulse)+','+Math.floor(80*pulse)+',1)');
      gr.addColorStop(1,'rgba(120,0,0,1)');
      ctx.fillStyle=gr;
      ctx.beginPath(); ctx.roundRect(gx,dy,gemSz,gemSz,3); ctx.fill();
      ctx.strokeStyle='rgba(255,100,100,'+pulse+')';
      ctx.lineWidth=1; ctx.stroke();
      ctx.restore();
    }

    // Count label when more gems incoming than visible slots
    if (buf>COLS) {
      ctx.save();
      ctx.font='bold '+Math.max(9,gemSz*0.78)+'px Arial,sans-serif';
      ctx.textAlign='center';
      ctx.fillStyle='rgba(0,0,0,0.7)';
      ctx.fillText('×'+buf, ox+BW/2+1, dy+gemSz*0.82+1);
      ctx.shadowColor='#ff4444'; ctx.shadowBlur=6;
      ctx.fillStyle='#ff4444';
      ctx.fillText('×'+buf, ox+BW/2, dy+gemSz*0.82);
      ctx.restore();
    }
  }

  // ── Stage-like board background gradient ─────────────────────
  const bgGrad=ctx.createLinearGradient(ox,oy,ox,oy+BH);
  bgGrad.addColorStop(0,'rgba(0,0,0,0.72)');
  bgGrad.addColorStop(0.35,charCol+'26');   // ~15% opacity hex tint
  bgGrad.addColorStop(0.7,charCol+'18');    // ~9% opacity hex tint
  bgGrad.addColorStop(1,'rgba(0,0,0,0.88)');
  ctx.fillStyle=bgGrad;
  ctx.fillRect(ox,oy,BW,BH);

  // ── Board frame: outer dark halo, character-color glow, inner highlight ──
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.9)'; ctx.shadowBlur=10;
  ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.lineWidth=4;
  ctx.strokeRect(ox-2,oy-2,BW+4,BH+4);
  ctx.restore();

  ctx.save();
  ctx.shadowColor=accentBorder; ctx.shadowBlur=16;
  ctx.strokeStyle=accentBorder; ctx.lineWidth=2;
  ctx.strokeRect(ox-1,oy-1,BW+2,BH+2);
  ctx.restore();

  // Inner bright highlight line — arcade field border feel
  ctx.save();
  ctx.strokeStyle=accentBright; ctx.lineWidth=1;
  ctx.globalAlpha=0.50;
  ctx.strokeRect(ox+1,oy+1,BW-2,BH-2);
  ctx.restore();

  // Outermost thin dark frame to crisp the edge
  ctx.strokeStyle='rgba(0,0,0,0.9)'; ctx.lineWidth=1;
  ctx.strokeRect(ox,oy,BW,BH);

  // ── Grid lines ───────────────────────────────────────────────
  ctx.strokeStyle='rgba(255,255,255,0.045)'; ctx.lineWidth=0.5;
  for (let r=1;r<ROWS;r++) {
    ctx.beginPath(); ctx.moveTo(ox,oy+r*CELL); ctx.lineTo(ox+BW,oy+r*CELL); ctx.stroke();
  }
  for (let c=1;c<COLS;c++) {
    ctx.beginPath(); ctx.moveTo(ox+c*CELL,oy); ctx.lineTo(ox+c*CELL,oy+BH); ctx.stroke();
  }

  // ── Draw non-power gems ──────────────────────────────────────
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
    const g=board[r][c]; if (!g||g.type===TP) continue;
    drawGem(ox+c*CELL,oy+r*CELL,CELL,CELL,g.color,g.type,g.count);
  }

  // ── Draw power gem groups as unified blocks ──────────────────
  const pgSeen=new Set();
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
    const g=board[r][c];
    if (!g||g.type!==TP||pgSeen.has(r*COLS+c)) continue;
    const col=g.color; let minR=r,maxR=r,minC=c,maxC=c;
    const q=[[r,c]];
    while(q.length){
      const [qr,qc]=q.shift(); const key=qr*COLS+qc;
      if(pgSeen.has(key)||qr<0||qr>=ROWS||qc<0||qc>=COLS) continue;
      const gg=board[qr][qc];
      if(!gg||gg.type!==TP||gg.color!==col) continue;
      pgSeen.add(key);
      minR=Math.min(minR,qr);maxR=Math.max(maxR,qr);
      minC=Math.min(minC,qc);maxC=Math.max(maxC,qc);
      q.push([qr-1,qc],[qr+1,qc],[qr,qc-1],[qr,qc+1]);
    }
    drawPowerBlock(ox+minC*CELL,oy+minR*CELL,(maxC-minC+1)*CELL,(maxR-minR+1)*CELL,col);
  }

  // ── Active piece + ghost ─────────────────────────────────────
  const p=pieces[bi];
  if (p) {
    // Ghost piece (drop preview) — 0.30 opacity for better readability
    let gY=p.y;
    while (isValid(board,{...p,y:gY+1})) gY++;
    if (gY!==p.y) {
      const gc=getPieceCells({...p,y:gY});
      ctx.globalAlpha=0.30;
      if (gc[0][1]>=0) drawGem(ox+gc[0][0]*CELL,oy+gc[0][1]*CELL,CELL,CELL,p.c1,p.t1||TN);
      if (gc[1][1]>=0) drawGem(ox+gc[1][0]*CELL,oy+gc[1][1]*CELL,CELL,CELL,p.c2,p.t2||TN);
      ctx.globalAlpha=1;
    }
    // Active piece (with sub-row interpolation for smooth fall)
    const ac=getPieceCells(p);
    const fp=fallProgress[bi];
    if (ac[0][1]>=0) drawGem(ox+ac[0][0]*CELL, oy+(ac[0][1]+fp)*CELL, CELL, CELL, p.c1, p.t1||TN);
    if (ac[1][1]>=0) drawGem(ox+ac[1][0]*CELL, oy+(ac[1][1]+fp)*CELL, CELL, CELL, p.c2, p.t2||TN);

    // Spawn flash outline
    if (spawnFlash[bi]>0) {
      const flashA=spawnFlash[bi]/0.18;
      ctx.strokeStyle=`rgba(255,255,255,${flashA*0.9})`;
      ctx.lineWidth=3;
      if (ac[0][1]>=0) { ctx.beginPath(); ctx.roundRect(ox+ac[0][0]*CELL+1, oy+(ac[0][1]+fp)*CELL+1, CELL-2, CELL-2, 3); ctx.stroke(); }
      if (ac[1][1]>=0) { ctx.beginPath(); ctx.roundRect(ox+ac[1][0]*CELL+1, oy+(ac[1][1]+fp)*CELL+1, CELL-2, CELL-2, 3); ctx.stroke(); }
    }
  }

  // ── Attack warning: dramatic red vignette + pulsing INCOMING! ─
  if (attackWarning[bi]>0) {
    attackWarning[bi]--;
    const a=attackWarning[bi]/90;
    const now=Date.now();

    // Multi-layer radial red vignette
    const vg=ctx.createRadialGradient(ox+BW/2,oy+BH/2,BH*0.12,ox+BW/2,oy+BH/2,BH*0.85);
    vg.addColorStop(0,'rgba(255,0,0,0)');
    vg.addColorStop(0.65,'rgba(200,0,0,'+(a*0.28)+')');
    vg.addColorStop(1,'rgba(220,20,20,'+(a*0.72)+')');
    ctx.fillStyle=vg; ctx.fillRect(ox,oy,BW,BH);

    // Pulsing solid edge bars at top and bottom
    const edgePulse=0.4+0.3*Math.sin(now*0.022);
    ctx.fillStyle='rgba(200,0,0,'+(a*edgePulse)+')';
    ctx.fillRect(ox,oy,BW,CELL*0.6);
    ctx.fillRect(ox,oy+BH-CELL*0.6,BW,CELL*0.6);

    // "INCOMING!" pulsing text with glow
    const textPulse=1+0.18*Math.sin(now*0.028);
    const textAlpha=Math.min(a*1.4,1);
    ctx.save();
    ctx.translate(ox+BW/2,oy+BH*0.5);
    ctx.scale(textPulse,textPulse);
    ctx.textAlign='center';
    const txtSz=Math.max(10,Math.min(CELL*0.9,20));
    ctx.fillStyle='rgba(0,0,0,0.75)';
    ctx.font='bold '+txtSz+"px 'Arial Black',Impact,sans-serif";
    ctx.fillText('INCOMING!',2,2);
    ctx.shadowColor='#ff2200'; ctx.shadowBlur=14*textPulse;
    const tg=ctx.createLinearGradient(-40,-txtSz,40,txtSz*0.4);
    tg.addColorStop(0,'#ffaaaa');
    tg.addColorStop(0.5,'#ff3300');
    tg.addColorStop(1,'#aa0000');
    ctx.fillStyle=tg;
    ctx.globalAlpha=textAlpha;
    ctx.fillText('INCOMING!',0,0);
    ctx.shadowBlur=0; ctx.globalAlpha=1;
    ctx.restore();
  }
}

function drawHUD() {
  const W=canvas.width;

  // ── Super meter bars: taller (8px), character-colored ─────────
  drawSuperBar(LX, BY-10, BW, 8, superMeter[0], 0);
  if (!survivalMode) drawSuperBar(RX, BY-10, BW, 8, superMeter[1], 1);

  // In survival mode, show a compact survival status bar above the board
  if (survivalMode) {
    const srvSpeedLevel=Math.floor(survivalTime/20)+1;
    const srvMin=Math.floor(survivalTime/60);
    const srvSec=Math.floor(survivalTime%60);
    const srvTimeStr=`${srvMin}:${srvSec.toString().padStart(2,'0')}`;
    const barW=BW, barH=18, barX=LX, barY=BY-barH-12;
    ctx.save();
    ctx.fillStyle='rgba(30,0,60,0.8)';
    ctx.beginPath(); ctx.roundRect(barX,barY,barW,barH,4); ctx.fill();
    ctx.strokeStyle='rgba(180,80,255,0.5)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.roundRect(barX,barY,barW,barH,4); ctx.stroke();
    ctx.font=`bold ${Math.min(barH*0.68,11)}px Arial,sans-serif`;
    ctx.textAlign='center'; ctx.fillStyle='#cc88ff'; ctx.shadowColor='#9900ff'; ctx.shadowBlur=6;
    ctx.fillText(`⏱ ${srvTimeStr}   SPEED LV ${srvSpeedLevel}   SCORE ${scores[0]}`, barX+barW/2, barY+barH*0.74);
    ctx.shadowBlur=0; ctx.restore();
    return; // skip normal HUD elements that require 2 boards
  }

  // ── Next piece preview box (between boards) ──────────────────
  const midX=(LX+BW+RX)/2;
  const nS=Math.floor(CELL*0.80);
  const boxW=nS*2+10, boxH=nS*2+28;
  const boxX=midX-boxW/2, boxY=BY;

  // Styled preview container
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.72)';
  ctx.beginPath(); ctx.roundRect(boxX,boxY,boxW,boxH,6); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.22)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.roundRect(boxX,boxY,boxW,boxH,6); ctx.stroke();
  // Subtle top-left inner shine
  ctx.strokeStyle='rgba(255,255,255,0.10)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(boxX+1,boxY+1,boxW-2,boxH-2,5); ctx.stroke();

  // "NEXT" label
  ctx.font='bold '+Math.min(CELL*0.44,9)+'px Arial,sans-serif';
  ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.fillText('NEXT', midX+1, boxY+11);
  ctx.fillStyle='#aabbcc';
  ctx.fillText('NEXT', midX, boxY+10);
  ctx.restore();

  // Gem preview inside box
  if (queues[0]) {
    const n0=queues[0].peek(0);
    if (n0) {
      drawGem(midX-nS-1, boxY+14,     nS, nS, n0.c1, n0.t1||TN);
      drawGem(midX-nS-1, boxY+14+nS+2, nS, nS, n0.c2, n0.t2||TN);
    }
    const n1=queues[0].peek(1);
    if (n1) {
      drawGem(midX+1, boxY+14,     nS, nS, n1.c1, n1.t1||TN);
      drawGem(midX+1, boxY+14+nS+2, nS, nS, n1.c2, n1.t2||TN);
    }
  }

  // ── Sound toggle button ───────────────────────────────────────
  const btnW=50, btnH=22, btnX=W-btnW-6, btnY=FIGHT_STRIP_H+5;
  ctx.save();
  // Background
  const bBg=ctx.createLinearGradient(btnX,btnY,btnX,btnY+btnH);
  bBg.addColorStop(0,'rgba(30,30,50,0.85)');
  bBg.addColorStop(1,'rgba(10,10,25,0.85)');
  ctx.fillStyle=bBg;
  ctx.beginPath(); ctx.roundRect(btnX,btnY,btnW,btnH,5); ctx.fill();
  // Border
  ctx.strokeStyle=soundOn?'rgba(80,220,80,0.55)':'rgba(220,80,80,0.45)';
  ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.roundRect(btnX,btnY,btnW,btnH,5); ctx.stroke();
  // Label
  ctx.font='bold 10px Arial,sans-serif'; ctx.textAlign='center';
  ctx.fillStyle=soundOn?'#77ee77':'#ee7777';
  ctx.fillText(soundOn?'♪ ON':'✕ OFF', btnX+btnW/2, btnY+btnH*0.70);
  ctx.restore();
}

function drawSuperBar(x, y, w, h, val, bi) {
  const pct = val / SUPER_MAX;
  const now = Date.now();
  const charIdx = (bi===0) ? playerChar : cpuChar;
  const pal = PAL[CHAR_COLORS[charIdx]] || PAL.gray;
  const colDim  = pal[2];   // dark core
  const colMid  = pal[1];   // main
  const colBrt  = pal[0];   // bright highlight

  // ── Background track ─────────────────────────────────────────
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 2); ctx.fill();

  // ── Filled portion ───────────────────────────────────────────
  if (pct > 0) {
    const fillW = w * pct;
    const grad = ctx.createLinearGradient(x, y, x+fillW, y);
    grad.addColorStop(0, colDim);
    grad.addColorStop(0.5, colMid);
    grad.addColorStop(1, colBrt);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.roundRect(x, y, fillW, h, 2); ctx.fill();

    // Shine strip on top half
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath(); ctx.roundRect(x+1, y+1, fillW-2, Math.max(1,h*0.4), 1); ctx.fill();
  }

  // ── 5 segment markers ────────────────────────────────────────
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 1;
  for (let s=1; s<5; s++) {
    const mx = x + (w/5)*s;
    ctx.beginPath(); ctx.moveTo(mx, y); ctx.lineTo(mx, y+h); ctx.stroke();
  }

  // ── Border ───────────────────────────────────────────────────
  if (pct >= 1) {
    // Bright pulsing glow when full
    const glow = 0.55 + 0.45*Math.sin(now*0.009);
    ctx.shadowColor = colBrt; ctx.shadowBlur = 10*glow;
    ctx.strokeStyle = colBrt;
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  }
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 2); ctx.stroke();
  ctx.shadowBlur = 0;

  // ── Full meter: overlay flash + SUPER READY label ─────────────
  if (pct >= 1) {
    const flash = 0.18 + 0.15*Math.sin(now*0.009);
    ctx.fillStyle = colBrt.replace(/[^,]+\)$/, flash+')') || 'rgba(255,255,200,'+flash+')';
    // Fallback safe flash overlay
    ctx.globalAlpha = flash * 1.2;
    ctx.fillStyle = colBrt;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 2); ctx.fill();
    ctx.globalAlpha = 1;

    ctx.shadowColor = colBrt; ctx.shadowBlur = 8;
    ctx.font = 'bold '+(h+2)+'px Arial,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('★ SUPER!', x+w/2, y+h-1);
    ctx.shadowBlur = 0;
  }

  // ── "SP" label on the left ────────────────────────────────────
  ctx.font = 'bold '+(h-1)+'px Arial,sans-serif';
  ctx.textAlign = 'right';
  ctx.fillStyle = pct>=1 ? colBrt : 'rgba(180,180,200,0.7)';
  ctx.fillText('SP', x-3, y+h-1);

  ctx.restore();
}

let gameTimerDisplay=0;
let shakeTimer=0, shakeAmt=0;
function triggerShake(amt) { shakeAmt=Math.max(shakeAmt,amt); shakeTimer=Math.max(shakeTimer,amt*3); }

const particles=[];
function spawnParticles(x,y,color,count){
  const pal=PAL[color]||PAL.gray;
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2, spd=1.5+Math.random()*3.5;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-2,life:1,maxLife:0.6+Math.random()*0.5,r:2+Math.random()*4,color:pal[Math.floor(Math.random()*3)]});
  }
}
function updateParticlesFx(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.life-=dt/p.maxLife;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life*0.9);
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

let confetti=[];
function spawnConfetti(W){
  confetti=[];
  for(let i=0;i<60;i++){
    confetti.push({x:Math.random()*W,y:-20-Math.random()*200,vx:(Math.random()-0.5)*2,vy:2+Math.random()*3,rot:Math.random()*Math.PI*2,rotV:(Math.random()-0.5)*0.2,color:['#ff4444','#44ff44','#4444ff','#ffff44','#ff44ff'][Math.floor(Math.random()*5)],w:6+Math.random()*8,h:4+Math.random()*5});
  }
}

function drawGame(dt) {
  gameTimerDisplay+=dt;
  const W=canvas.width, H=canvas.height;
  const ctrlTop=H-148;

  // Screen shake
  const sx=(shakeTimer>0)?(Math.random()-0.5)*shakeAmt:0;
  const sy=(shakeTimer>0)?(Math.random()-0.5)*shakeAmt:0;
  ctx.save(); ctx.translate(sx,sy);

  // ── Background: dramatic stage-split with vignette ──────────
  const bgBase = ctx.createLinearGradient(0,0,0,H);
  bgBase.addColorStop(0,'#050012');
  bgBase.addColorStop(0.6,'#080018');
  bgBase.addColorStop(1,'#020008');
  ctx.fillStyle=bgBase; ctx.fillRect(0,0,W,H);

  // Left half: player character tint (stronger gradient)
  const bgL=ctx.createLinearGradient(0,0,W*0.55,0);
  bgL.addColorStop(0,getCharBg(playerChar)+'55');   // ~33% opacity at edge
  bgL.addColorStop(0.7,getCharBg(playerChar)+'18'); // ~9% at center-ward
  bgL.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bgL; ctx.fillRect(0,0,W*0.55,H);

  // Right half: CPU character tint (skip in survival mode)
  if (!survivalMode && cpuChar>=0) {
    const bgR=ctx.createLinearGradient(W,0,W*0.45,0);
    bgR.addColorStop(0,getCharBg(cpuChar)+'55');
    bgR.addColorStop(0.7,getCharBg(cpuChar)+'18');
    bgR.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=bgR; ctx.fillRect(W*0.45,0,W*0.55,H);
  }

  // Edge vignette (both sides dark)
  const vigL=ctx.createLinearGradient(0,0,W*0.12,0);
  vigL.addColorStop(0,'rgba(0,0,0,0.55)'); vigL.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=vigL; ctx.fillRect(0,0,W*0.12,H);
  const vigR=ctx.createLinearGradient(W,0,W*0.88,0);
  vigR.addColorStop(0,'rgba(0,0,0,0.55)'); vigR.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=vigR; ctx.fillRect(W*0.88,0,W*0.12,H);

  // ── Fight strip at top ────────────────────────────────────────
  const fH = FIGHT_STRIP_H;
  const now2=Date.now();

  // Dark metallic gradient background
  const stripGrad=ctx.createLinearGradient(0,0,0,fH);
  stripGrad.addColorStop(0,'rgba(28,28,40,0.97)');
  stripGrad.addColorStop(0.5,'rgba(14,14,24,0.97)');
  stripGrad.addColorStop(1,'rgba(6,6,16,0.98)');
  ctx.fillStyle=stripGrad; ctx.fillRect(0,0,W,fH);

  // Subtle metallic sheen lines
  ctx.strokeStyle='rgba(255,255,255,0.04)'; ctx.lineWidth=1;
  for (let sy2=6;sy2<fH-4;sy2+=14) {
    ctx.beginPath(); ctx.moveTo(0,sy2); ctx.lineTo(W,sy2); ctx.stroke();
  }

  // Bottom separator line
  {
    const sepGrad=ctx.createLinearGradient(0,fH,W,fH);
    sepGrad.addColorStop(0,PAL[CHAR_COLORS[playerChar]][3]);
    sepGrad.addColorStop(0.48,'rgba(255,255,255,0.25)');
    sepGrad.addColorStop(0.52,'rgba(255,255,255,0.25)');
    const cpuSepColor=(survivalMode||cpuChar<0)?PAL[CHAR_COLORS[playerChar]][3]:PAL[CHAR_COLORS[cpuChar]][3];
    sepGrad.addColorStop(1,cpuSepColor);
    ctx.strokeStyle=sepGrad; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(0,fH); ctx.lineTo(W,fH); ctx.stroke();
  }

  // ── Character portrait boxes ──────────────────────────────────
  const pPose = attackWarning[0]>60?'hurt':'idle';
  const cPose = attackWarning[1]>60?'hurt':'idle';
  const fsc = fH/130;

  // Player portrait box (left)
  const pBoxW=Math.min(fH*0.75,62), pBoxH=fH*0.88, pBoxX=W*0.04, pBoxY=fH*0.06;
  ctx.save();
  const pBoxBg=ctx.createLinearGradient(pBoxX,pBoxY,pBoxX+pBoxW,pBoxY+pBoxH);
  pBoxBg.addColorStop(0,getCharBg(playerChar)+'cc');
  pBoxBg.addColorStop(1,'rgba(0,0,0,0.6)');
  ctx.fillStyle=pBoxBg;
  ctx.beginPath(); ctx.roundRect(pBoxX,pBoxY,pBoxW,pBoxH,4); ctx.fill();
  ctx.shadowColor=PAL[CHAR_COLORS[playerChar]][3]; ctx.shadowBlur=8;
  ctx.strokeStyle=PAL[CHAR_COLORS[playerChar]][3]; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(pBoxX,pBoxY,pBoxW,pBoxH,4); ctx.stroke();
  ctx.restore();
  drawCharacter(playerChar, pBoxX+pBoxW*0.5, pBoxY+pBoxH*0.54, fsc*0.88, pPose);

  // CPU portrait box (right, mirrored) — skip in survival mode
  if (!survivalMode && cpuChar>=0) {
    const cBoxW=pBoxW, cBoxH=pBoxH, cBoxX=W-W*0.04-pBoxW, cBoxY=pBoxY;
    ctx.save();
    const cBoxBg=ctx.createLinearGradient(cBoxX+cBoxW,cBoxY,cBoxX,cBoxY+cBoxH);
    cBoxBg.addColorStop(0,getCharBg(cpuChar)+'cc');
    cBoxBg.addColorStop(1,'rgba(0,0,0,0.6)');
    ctx.fillStyle=cBoxBg;
    ctx.beginPath(); ctx.roundRect(cBoxX,cBoxY,cBoxW,cBoxH,4); ctx.fill();
    ctx.shadowColor=PAL[CHAR_COLORS[cpuChar]][3]; ctx.shadowBlur=8;
    ctx.strokeStyle=PAL[CHAR_COLORS[cpuChar]][3]; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(cBoxX,cBoxY,cBoxW,cBoxH,4); ctx.stroke();
    ctx.restore();
    ctx.save(); ctx.translate(W,0); ctx.scale(-1,1);
    drawCharacter(cpuChar, W-cBoxX-cBoxW*0.5, cBoxY+cBoxH*0.54, fsc*0.88, cPose);
    ctx.restore();
  }

  // ── Name plates ───────────────────────────────────────────────
  const nameY=fH*0.28, nameH=fH*0.22;
  const nameFontSz=Math.min(fH*0.19,14);
  // Player name plate
  const pNX=W*0.155, pNW=W*0.18;
  ctx.save();
  ctx.fillStyle=PAL[CHAR_COLORS[playerChar]][1]+'cc';
  ctx.beginPath(); ctx.roundRect(pNX,nameY,pNW,nameH,3); ctx.fill();
  ctx.strokeStyle=PAL[CHAR_COLORS[playerChar]][0]; ctx.lineWidth=1;
  ctx.stroke();
  ctx.font='bold '+nameFontSz+'px Arial,sans-serif'; ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,0.55)';
  ctx.fillText(CHAR_NAMES[playerChar], pNX+pNW/2+1, nameY+nameH*0.76+1);
  ctx.fillStyle='#ffffff';
  ctx.fillText(CHAR_NAMES[playerChar], pNX+pNW/2, nameY+nameH*0.76);
  ctx.restore();

  // CPU name plate — skip in survival mode
  const cNW=W*0.18, cNX=W-W*0.155-cNW;
  if (!survivalMode && cpuChar>=0) {
    ctx.save();
    ctx.fillStyle=PAL[CHAR_COLORS[cpuChar]][1]+'cc';
    ctx.beginPath(); ctx.roundRect(cNX,nameY,cNW,nameH,3); ctx.fill();
    ctx.strokeStyle=PAL[CHAR_COLORS[cpuChar]][0]; ctx.lineWidth=1;
    ctx.stroke();
    ctx.font='bold '+nameFontSz+'px Arial,sans-serif'; ctx.textAlign='center';
    ctx.fillStyle='rgba(0,0,0,0.55)';
    ctx.fillText(CHAR_NAMES[cpuChar], cNX+cNW/2+1, nameY+nameH*0.76+1);
    ctx.fillStyle='#ffffff';
    ctx.fillText(CHAR_NAMES[cpuChar], cNX+cNW/2, nameY+nameH*0.76);
    ctx.restore();
  }

  // ── Score display ─────────────────────────────────────────────
  const scY=fH*0.72, scFontSz=Math.min(fH*0.24,17);
  ctx.font='bold '+scFontSz+"px 'Arial Black',Impact,Arial,sans-serif";
  const playerScoreStr=String(scores[0]);
  // Player score
  ctx.save();
  ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.fillText(playerScoreStr, pNX+pNW/2+1, scY+1);
  ctx.shadowColor=PAL[CHAR_COLORS[playerChar]][3]; ctx.shadowBlur=6;
  ctx.fillStyle=PAL[CHAR_COLORS[playerChar]][0];
  ctx.fillText(playerScoreStr, pNX+pNW/2, scY);
  ctx.restore();
  // CPU score — skip in survival mode
  if (!survivalMode && cpuChar>=0) {
    const cpuScoreStr=String(scores[1]);
    ctx.save();
    ctx.textAlign='center';
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.fillText(cpuScoreStr, cNX+cNW/2+1, scY+1);
    ctx.shadowColor=PAL[CHAR_COLORS[cpuChar]][3]; ctx.shadowBlur=6;
    ctx.fillStyle=PAL[CHAR_COLORS[cpuChar]][0];
    ctx.fillText(cpuScoreStr, cNX+cNW/2, scY);
    ctx.restore();
  }

  // ── VS badge in center (or SURVIVAL time in survival mode) ────
  if (survivalMode) {
    // Survival: show time survived in center of strip
    const srvSpeedLevel=Math.floor(survivalTime/20)+1;
    const srvMin=Math.floor(survivalTime/60);
    const srvSec=Math.floor(survivalTime%60);
    const srvTimeStr=`${srvMin}:${srvSec.toString().padStart(2,'0')}`;
    ctx.save();
    ctx.textAlign='center';
    const srvFontSz=Math.min(fH*0.22,16);
    ctx.font='bold '+srvFontSz+"px Arial,sans-serif";
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.fillText(`⏱ ${srvTimeStr}  LV ${srvSpeedLevel}`, W/2+1, fH*0.48+1);
    ctx.shadowColor='#cc88ff'; ctx.shadowBlur=8;
    ctx.fillStyle='#cc88ff';
    ctx.fillText(`⏱ ${srvTimeStr}  LV ${srvSpeedLevel}`, W/2, fH*0.48);
    ctx.shadowBlur=0; ctx.restore();
  } else {
    // ── VS badge in center ────────────────────────────────────────
    const vsAnim=0.88+0.12*Math.sin(now2*0.004);
    const vsFontSz=Math.min(fH*0.34,26);
    ctx.save();
    ctx.translate(W/2, fH*0.56);
    ctx.scale(vsAnim, vsAnim);
    ctx.textAlign='center';
    ctx.fillStyle='rgba(0,0,0,0.55)';
    ctx.beginPath(); ctx.roundRect(-20,-vsFontSz*0.85,40,vsFontSz*1.1,4); ctx.fill();
    ctx.font='bold '+vsFontSz+"px 'Arial Black',Impact,sans-serif";
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.fillText('VS',1,1);
    const vsGr=ctx.createLinearGradient(0,-vsFontSz,0,vsFontSz*0.3);
    vsGr.addColorStop(0,'#ffffff');
    vsGr.addColorStop(0.4,'#ffee44');
    vsGr.addColorStop(1,'#ff8800');
    ctx.fillStyle=vsGr;
    ctx.shadowColor='#ff8800'; ctx.shadowBlur=10*vsAnim;
    ctx.fillText('VS',0,0);
    ctx.shadowBlur=0;
    ctx.restore();
  }
  // ──────────────────────────────────────────────────────────────

  // Control area dark overlay drawn on canvas
  ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(0,ctrlTop,W,148);
  ctx.strokeStyle='rgba(255,255,255,0.1)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,ctrlTop); ctx.lineTo(W,ctrlTop); ctx.stroke();

  drawBoard(0,LX,BY); if (!survivalMode) drawBoard(1,RX,BY); drawHUD();
  drawParticles();

  // Gem break animations
  for (const gb of gemBreaks) {
    const t=gb.timer; // 1→0
    const pal=PAL[gb.color]||PAL.gray;
    ctx.save();
    ctx.globalAlpha=t;
    // Flash white at start, fade to gem color
    const flashT=Math.max(0,t*2-1); // 1→0 in first half
    ctx.fillStyle=flashT>0?`rgba(255,255,255,${flashT})`:pal[0];
    // Scale up then shrink (boom effect)
    const scale=t<0.5?1+(0.5-t)*0.8:t*0.8+0.2;
    const s=CELL*scale;
    ctx.fillRect(gb.x+(CELL-s)/2,gb.y+(CELL-s)/2,s,s);
    ctx.globalAlpha=1;
    ctx.restore();
  }

  // Chain combo display (enhanced)
  for (let bi=0;bi<2;bi++) {
    const cd=chainDisplay[bi];
    if (cd.timer<=0) continue;
    const ox=bi===0?LX:RX;
    const alpha=Math.min(cd.timer,0.95);
    const entryT=Math.max(0,cd.timer-1.4); // first 0.4s = entry burst
    const scl=1+entryT*2.2; // big then settles

    // Screen flash for big chains
    if (cd.chain>=3 && cd.timer>1.55) {
      const flashAlpha=Math.min((cd.timer-1.55)*4,0.35);
      ctx.fillStyle=cd.chain>=4?`rgba(255,100,0,${flashAlpha})`:`rgba(255,200,0,${flashAlpha})`;
      ctx.fillRect(ox,BY,BW,BH);
    }

    ctx.save();
    ctx.globalAlpha=Math.min(alpha,1);
    ctx.translate(ox+BW/2, BY+BH*0.35);
    ctx.scale(scl,scl);
    ctx.textAlign='center';

    const sz=Math.min(CELL*1.5,36);
    const chainColors=['#ffee00','#ff8800','#ff4400','#ff0088'];
    const col=chainColors[Math.min(cd.chain-2,3)];

    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.font=`bold ${sz}px 'Arial Black',Impact,sans-serif`;
    ctx.fillText(`x${cd.chain} CHAIN!`,2,2);

    // Glow
    ctx.shadowColor=col; ctx.shadowBlur=28+8*Math.sin(Date.now()*0.01);

    // Gradient fill
    const tg=ctx.createLinearGradient(-70,-sz,70,sz*0.4);
    tg.addColorStop(0,'#ffffff');
    tg.addColorStop(0.4,col);
    tg.addColorStop(1,col==='#ffee00'?'#ff8800':'#ff0000');
    ctx.fillStyle=tg;
    ctx.fillText(`x${cd.chain} CHAIN!`,0,0);
    ctx.shadowBlur=0;

    // For x4+: rainbow shimmer
    if (cd.chain>=4) {
      const shimX=((Date.now()*0.003)%2)-1;
      const shim=ctx.createLinearGradient(shimX*70-30,0,shimX*70+30,0);
      shim.addColorStop(0,'rgba(255,255,255,0)');
      shim.addColorStop(0.5,'rgba(255,255,255,0.55)');
      shim.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=shim;
      ctx.fillText(`x${cd.chain} CHAIN!`,0,0);
    }

    ctx.restore();
  }

  // ALL CLEAR banner display
  for (let bi=0;bi<2;bi++) {
    const ac=allClearDisplay[bi];
    if (ac.timer>0) {
      const ox=bi===0?LX:RX;
      const alpha=Math.min(ac.timer,1.0);
      const scl=ac.timer>2.0?1+(ac.timer-2.0)*0.8:1;
      ctx.save();
      ctx.globalAlpha=alpha;
      ctx.translate(ox+BW/2, BY+BH*0.5);
      ctx.scale(scl,scl);
      ctx.textAlign='center';
      const sz=Math.min(CELL*1.6,36);
      // Radial glow behind text
      const glowR=sz*2.5;
      const glow=ctx.createRadialGradient(0,0,0,0,0,glowR);
      glow.addColorStop(0,'rgba(255,200,0,0.55)');
      glow.addColorStop(0.5,'rgba(255,150,0,0.25)');
      glow.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=glow;
      ctx.beginPath(); ctx.arc(0,0,glowR,0,Math.PI*2); ctx.fill();
      // Shadow
      ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.font=`bold ${sz}px 'Arial Black',Impact,sans-serif`;
      ctx.fillText('ALL CLEAR!',3,3);
      // Gold text
      ctx.shadowColor='#ffdd00'; ctx.shadowBlur=30;
      const acGrad=ctx.createLinearGradient(-80,-sz,80,sz*0.3);
      acGrad.addColorStop(0,'#ffffff');
      acGrad.addColorStop(0.3,'#ffe866');
      acGrad.addColorStop(0.7,'#ffcc00');
      acGrad.addColorStop(1,'#ff8800');
      ctx.fillStyle=acGrad; ctx.fillText('ALL CLEAR!',0,0);
      ctx.shadowBlur=0;
      ctx.restore();
    }
  }

  // Pause overlay
  if (gamePaused) {
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffffff'; ctx.font=`bold ${Math.min(W*0.1,44)}px 'Arial Black',Impact,sans-serif`;
    ctx.textAlign='center'; ctx.shadowColor='#88aaff'; ctx.shadowBlur=20;
    ctx.fillText('PAUSED',W/2,H*0.45); ctx.shadowBlur=0;
    ctx.fillStyle='#aaaacc'; ctx.font=`${Math.min(W*0.042,18)}px Arial,sans-serif`;
    ctx.fillText('Tap ⏸ to resume',W/2,H*0.55);
  }
  ctx.restore(); // end shake transform
}

// ============================================================
// RESULT SCREEN
// ============================================================
let resultTimer=0;

function drawResult(dt) {
  resultTimer+=dt;
  const W=canvas.width, H=canvas.height;
  const isWin=winner===0;

  // Background
  if (isWin) {
    // Gold-tinged dark background for win
    const bg=ctx.createRadialGradient(W/2,H*0.4,0,W/2,H*0.5,Math.max(W,H)*0.8);
    bg.addColorStop(0,'#1a1000'); bg.addColorStop(0.5,'#0a0800'); bg.addColorStop(1,'#000000');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  } else {
    // Dark red/grey for lose
    const bg=ctx.createRadialGradient(W/2,H*0.4,0,W/2,H*0.5,Math.max(W,H)*0.8);
    bg.addColorStop(0,'#110005'); bg.addColorStop(0.5,'#080008'); bg.addColorStop(1,'#000000');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  }

  // CRT scanlines
  ctx.save(); ctx.globalAlpha=0.04; ctx.fillStyle='#000';
  for (let ly=0;ly<H;ly+=3) ctx.fillRect(0,ly,W,1);
  ctx.restore();

  // Confetti for player win
  if (isWin) {
    for (const c of confetti) {
      c.x+=c.vx; c.y+=c.vy; c.rot+=c.rotV;
      if (c.y>canvas.height+20) { c.y=-20; c.x=Math.random()*canvas.width; }
      ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot);
      ctx.globalAlpha=0.85;
      ctx.fillStyle=c.color; ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);
      ctx.globalAlpha=1; ctx.restore();
    }
  }

  // Dynamic radial burst behind character (win: golden, lose: dark red)
  const burstR=Math.min(W,H)*0.42;
  const burstAlpha=isWin?(0.12+0.06*Math.sin(resultTimer*2.5)):(0.06+0.03*Math.abs(Math.sin(resultTimer)));
  const burstCol=isWin?`rgba(255,200,0,${burstAlpha})`:`rgba(180,0,0,${burstAlpha})`;
  const burst=ctx.createRadialGradient(W/2,H*0.5,0,W/2,H*0.5,burstR);
  burst.addColorStop(0,burstCol); burst.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=burst; ctx.fillRect(0,0,W,H);

  // Starburst rays behind character (win only)
  if (isWin) {
    ctx.save(); ctx.translate(W/2,H*0.52);
    ctx.rotate(resultTimer*0.3);
    for (let ri=0;ri<12;ri++) {
      const ang=(ri/12)*Math.PI*2;
      const rLen=Math.min(W,H)*0.38;
      ctx.save(); ctx.rotate(ang);
      const rg=ctx.createLinearGradient(0,0,0,-rLen);
      rg.addColorStop(0,`rgba(255,200,0,0.12)`); rg.addColorStop(1,'rgba(255,200,0,0)');
      ctx.fillStyle=rg;
      ctx.beginPath(); ctx.moveTo(-rLen*0.04,0); ctx.lineTo(0,-rLen); ctx.lineTo(rLen*0.04,0); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  // Winner character — large, bouncing celebrate pose
  const sc=Math.min(W,H)/260;
  const bounce=Math.abs(Math.sin(resultTimer*2.8))*9*sc;
  const charIdx=(isWin||(lastGameWasSurvival&&!isWin))?playerChar:(cpuChar>=0?cpuChar:playerChar);
  drawCharacter(charIdx,W/2,H*0.52-bounce,sc*1.5,lastGameWasSurvival?'hurt':'celebrate');

  // WIN/LOSE main text
  const mainTxt=isWin?'YOU WIN!':'GAME OVER';
  const mainSize=Math.min(W*0.12,58);
  const mainY=H*0.14;
  ctx.textAlign='center';
  ctx.font=`bold ${mainSize}px 'Arial Black',Impact,sans-serif`;

  if (isWin) {
    // Multiple glow layers for dramatic gold WIN text
    ctx.strokeStyle='rgba(0,0,0,0.85)'; ctx.lineWidth=mainSize*0.1; ctx.lineJoin='round';
    ctx.strokeText(mainTxt,W/2,mainY);
    ctx.shadowColor='#ff8800'; ctx.shadowBlur=40+18*Math.sin(resultTimer*3);
    ctx.fillStyle='rgba(255,100,0,0.5)'; ctx.fillText(mainTxt,W/2,mainY);
    ctx.shadowColor='#ffff00'; ctx.shadowBlur=24+10*Math.sin(resultTimer*2.5);
    ctx.fillStyle='rgba(255,240,0,0.35)'; ctx.fillText(mainTxt,W/2,mainY);
    ctx.shadowBlur=0;
    // Main gold fill with animated shimmer
    const winGrad=ctx.createLinearGradient(W/2-mainSize*2,mainY-mainSize,W/2+mainSize*2,mainY+mainSize*0.3);
    const shimmerPos=(Math.sin(resultTimer*2)+1)*0.5;
    winGrad.addColorStop(Math.max(0,shimmerPos-0.15),'#cc8800');
    winGrad.addColorStop(shimmerPos,'#ffffff');
    winGrad.addColorStop(Math.min(1,shimmerPos+0.15),'#ffdd00');
    winGrad.addColorStop(1,'#ff8800');
    ctx.fillStyle=winGrad; ctx.fillText(mainTxt,W/2,mainY);
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=mainSize*0.025;
    ctx.strokeText(mainTxt,W/2,mainY);
  } else {
    // Dark grim GAME OVER text
    ctx.strokeStyle='rgba(0,0,0,0.9)'; ctx.lineWidth=mainSize*0.1; ctx.lineJoin='round';
    ctx.strokeText(mainTxt,W/2,mainY);
    ctx.shadowColor='#880000'; ctx.shadowBlur=22+8*Math.abs(Math.sin(resultTimer*2));
    ctx.fillStyle='rgba(180,0,0,0.5)'; ctx.fillText(mainTxt,W/2,mainY);
    ctx.shadowBlur=0;
    const loseGrad=ctx.createLinearGradient(0,mainY-mainSize,0,mainY+mainSize*0.2);
    loseGrad.addColorStop(0,'#ff6666'); loseGrad.addColorStop(0.5,'#cc2222'); loseGrad.addColorStop(1,'#880000');
    ctx.fillStyle=loseGrad; ctx.fillText(mainTxt,W/2,mainY);
  }
  ctx.shadowBlur=0;

  // Score breakdown panel
  const panelW=Math.min(W*0.82,340), panelH=Math.min(H*0.1,60);
  const panelX=W/2-panelW/2, panelY=H*0.22;
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.beginPath(); ctx.roundRect(panelX,panelY,panelW,panelH,8); ctx.fill();
  ctx.strokeStyle=isWin?'rgba(200,160,0,0.5)':'rgba(150,50,50,0.5)';
  ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(panelX,panelY,panelW,panelH,8); ctx.stroke();

  ctx.textAlign='center';
  if (lastGameWasSurvival) {
    // Survival result: show time survived + score
    const srvMin=Math.floor(survivalTime/60);
    const srvSec=Math.floor(survivalTime%60);
    const srvTimeStr=`${srvMin}:${srvSec.toString().padStart(2,'0')}`;
    const srvLevel=Math.floor(survivalTime/20)+1;
    ctx.fillStyle='rgba(200,200,220,0.75)'; ctx.font=`${Math.min(W*0.03,12)}px Arial,sans-serif`;
    ctx.fillText('SURVIVAL MODE',W/2,panelY+panelH*0.32);
    ctx.font=`bold ${Math.min(W*0.046,18)}px Arial,sans-serif`;
    ctx.fillStyle='#cc88ff'; ctx.shadowColor='#9900ff'; ctx.shadowBlur=8;
    ctx.fillText(`Time: ${srvTimeStr}   Level: ${srvLevel}`,W/2,panelY+panelH*0.65);
    ctx.shadowBlur=0;
    ctx.font=`bold ${Math.min(W*0.05,20)}px Arial,sans-serif`;
    ctx.fillStyle='#ffee44'; ctx.shadowColor='#ffcc00'; ctx.shadowBlur=6;
    ctx.fillText(`Score: ${survivalScore}`,W/2,panelY+panelH*0.92);
    ctx.shadowBlur=0;
  } else {
    const scoreFS=Math.min(W*0.038,15);
    ctx.font=`bold ${scoreFS}px Arial,sans-serif`;
    // Player score
    const pScoreX=panelX+panelW*0.26, cpuScoreX=panelX+panelW*0.74;
    const labelY=panelY+panelH*0.38, valY=panelY+panelH*0.8;
    ctx.fillStyle='rgba(200,200,220,0.7)'; ctx.font=`${Math.min(W*0.03,11)}px Arial,sans-serif`;
    ctx.fillText(CHAR_NAMES[playerChar],pScoreX,labelY);
    if (cpuChar>=0) ctx.fillText(CHAR_NAMES[cpuChar],cpuScoreX,labelY);
    ctx.font=`bold ${Math.min(W*0.048,20)}px Arial,sans-serif`;
    ctx.fillStyle=isWin?'#ffee44':'#ffffff'; ctx.fillText(scores[0],pScoreX,valY);
    if (cpuChar>=0) { ctx.fillStyle=isWin?'#ffffff':'#ffee44'; ctx.fillText(scores[1],cpuScoreX,valY); }
    // Divider
    const divX=panelX+panelW/2;
    ctx.strokeStyle='rgba(180,180,200,0.3)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(divX,panelY+6); ctx.lineTo(divX,panelY+panelH-6); ctx.stroke();
    ctx.fillStyle='rgba(180,180,200,0.5)'; ctx.font=`${Math.min(W*0.028,10)}px Arial,sans-serif`;
    ctx.fillText('VS',divX,panelY+panelH*0.58);
  }

  // Best score / rank display
  const best=getBestScore(difficulty);
  const rankY=panelY+panelH+Math.min(H*0.025,16);
  if (best!==null) {
    const newBest=(winner===0&&scores[0]>=best);
    ctx.fillStyle=newBest?'#ffee44':'rgba(200,175,80,0.75)';
    ctx.font=`bold ${Math.min(W*0.038,14)}px Arial,sans-serif`;
    ctx.textAlign='center';
    if (newBest) { ctx.shadowColor='#ffcc00'; ctx.shadowBlur=10; }
    ctx.fillText(newBest?`NEW BEST!  ${scores[0]}`:`BEST: ${best}  [${DIFF_SETTINGS[difficulty].name}]`,W/2,rankY);
    ctx.shadowBlur=0;
  }

  // Score grade (win only)
  if (isWin && scores[0]>0) {
    const gradeThresholds=[[5000,'S'],[3000,'A'],[1500,'B'],[600,'C'],[0,'D']];
    const grade=gradeThresholds.find(([t])=>scores[0]>=t)[1];
    const gradeColors={S:'#ffdd00',A:'#ff8800',B:'#88ff44',C:'#44aaff',D:'#aaaacc'};
    const gradeX=panelX+panelW+Math.min(W*0.04,20);
    const gradeY2=panelY+panelH*0.75;
    const gSize=Math.min(panelH*1.1,52);
    ctx.font=`bold ${gSize}px 'Arial Black',Impact,sans-serif`;
    ctx.strokeStyle='rgba(0,0,0,0.85)'; ctx.lineWidth=gSize*0.1; ctx.lineJoin='round';
    ctx.strokeText(grade,gradeX,gradeY2);
    ctx.shadowColor=gradeColors[grade]||'#ffffff'; ctx.shadowBlur=16;
    ctx.fillStyle=gradeColors[grade]||'#ffffff'; ctx.fillText(grade,gradeX,gradeY2);
    ctx.shadowBlur=0;
  }

  // TAP TO PLAY AGAIN blinking
  if (Math.floor(resultTimer*1.8)%2===0) {
    const tapY=H*0.87;
    const tapSize=Math.min(W*0.05,22);
    ctx.font=`bold ${tapSize}px 'Arial Black',Impact,sans-serif`;
    ctx.textAlign='center';
    ctx.strokeStyle='rgba(0,0,0,0.85)'; ctx.lineWidth=tapSize*0.1; ctx.lineJoin='round';
    ctx.strokeText('TAP TO PLAY AGAIN',W/2,tapY);
    ctx.shadowColor=isWin?'#ffff44':'#ff6666'; ctx.shadowBlur=12+4*Math.sin(resultTimer*3);
    const tapGrad=ctx.createLinearGradient(0,tapY-tapSize,0,tapY+4);
    if (isWin) {
      tapGrad.addColorStop(0,'#ffffff'); tapGrad.addColorStop(0.5,'#ffee88'); tapGrad.addColorStop(1,'#ffcc00');
    } else {
      tapGrad.addColorStop(0,'#ffaaaa'); tapGrad.addColorStop(1,'#ff6666');
    }
    ctx.fillStyle=tapGrad; ctx.fillText('TAP TO PLAY AGAIN',W/2,tapY);
    ctx.shadowBlur=0;
  }
}

// ============================================================
// INPUT
// ============================================================
function handleInput(action) {
  if (state===S.TITLE) { setState(S.CHARSEL); return; }
  if (state===S.RESULT) { setState(S.CHARSEL); return; }
  if (state===S.CHARSEL) {
    if (action==='left'||action==='up') selectedChar=(selectedChar-1+4)%4;
    else if (action==='right'||action==='down') selectedChar=(selectedChar+1)%4;
    else if (action==='select'||action==='tap') { playerChar=selectedChar; setState(S.DIFF); }
    return;
  }
  if (state===S.DIFF) {
    if (action==='left') difficulty=Math.max(0,difficulty-1);
    else if (action==='right') difficulty=Math.min(2,difficulty+1);
    else if (action==='select'||action==='tap') setState(S.VS);
    return;
  }
  if (state===S.GAME&&!gameOver) {
    const p=pieces[0]; if (!p) return;
    if (action==='left') {
      const np={...p,x:p.x-1};
      if (isValid(boards[0],np)) {
        pieces[0].x--;
        if (lockDelayActive[0]&&lockMoveCount[0]<MAX_LOCK_RESETS) { lockDelayTimer[0]=DIFF_SETTINGS[difficulty].lockDelay; lockMoveCount[0]++; }
      }
    }
    else if (action==='right') {
      const np={...p,x:p.x+1};
      if (isValid(boards[0],np)) {
        pieces[0].x++;
        if (lockDelayActive[0]&&lockMoveCount[0]<MAX_LOCK_RESETS) { lockDelayTimer[0]=DIFF_SETTINGS[difficulty].lockDelay; lockMoveCount[0]++; }
      }
    }
    else if (action==='down') {
      const np={...p,y:p.y+1};
      if (isValid(boards[0],np)) { pieces[0].y++; scores[0]++; fallTimers[0]=0; }
      else {
        // Soft drop while on ground locks immediately
        lockPiece(0);
        if (!spawnPiece(0)) { endGame(0); return; }
      }
    }
    else if (action==='rotleft') {
      rotatePlayer(-1);
      if (lockDelayActive[0]&&lockMoveCount[0]<MAX_LOCK_RESETS) { lockDelayTimer[0]=DIFF_SETTINGS[difficulty].lockDelay; lockMoveCount[0]++; }
    }
    else if (action==='rotright') {
      rotatePlayer(1);
      if (lockDelayActive[0]&&lockMoveCount[0]<MAX_LOCK_RESETS) { lockDelayTimer[0]=DIFF_SETTINGS[difficulty].lockDelay; lockMoveCount[0]++; }
    }
    else if (action==='super') activateSuper(0);
    else if (action==='harddrop') {
      while (isValid(boards[0],{...pieces[0],y:pieces[0].y+1})) { pieces[0].y++; scores[0]++; }
      lockPiece(0);
      if (!spawnPiece(0)) { endGame(0); return; }
    }
  }
}

function rotatePlayer(dir) {
  const p=pieces[0];
  const no=(p.orient+4+dir)%4;
  const np={...p,orient:no};
  if (isValid(boards[0],np)) { pieces[0].orient=no; return; }
  for (const dx of [1,-1,2,-2]) {
    const np2={...np,x:np.x+dx};
    if (isValid(boards[0],np2)) { pieces[0].x+=dx; pieces[0].orient=no; return; }
  }
}

function checkGameOver(bi) {
  if (!pieces[bi]) return;
  for (const [cx2,cy2] of getPieceCells(pieces[bi])) {
    if (cy2>=0&&boards[bi][cy2][cx2]) { endGame(bi); return; }
  }
}

function endGame(loser) {
  if (gameOver) return;
  gameOver=true; winner=1-loser;
  if (survivalMode) {
    survivalMode=false;
    lastGameWasSurvival=true;
    survivalScore=scores[0];
    setTimeout(()=>setState(S.RESULT),1200);
    return;
  }
  if (arcadeMode && winner===0) {
    arcadeScoreTotal=(arcadeScoreTotal||0)+scores[0];
    if (arcadeRound>=3) {
      setTimeout(()=>setState(S.ARCADE_END),1400);
    } else {
      arcadeRound++;
      setTimeout(()=>setState(S.ARCADE),1200);
    }
  } else {
    if (arcadeMode) arcadeMode=false;
    setTimeout(()=>setState(S.RESULT),1200);
  }
}

// ── 3-Zone Virtual Controller ─────────────────────────────────
// Left zone: DAS left  |  Mid zone: tap=rotate  |  Right zone: DAS right
// Button row: SUPER | DROP | PAUSE

const DAS_DELAY = 160, DAS_REPEAT = 70;
const zoneTimers = {};

function startZone(action) {
  if (zoneTimers[action]) return;
  initAudio();
  if (state !== S.GAME || gameOver || gamePaused) return;
  handleInput(action);
  zoneTimers[action] = setTimeout(() => {
    zoneTimers[action + '_interval'] = setInterval(() => {
      if (state !== S.GAME || gameOver || gamePaused) { stopZone(action); return; }
      handleInput(action);
    }, DAS_REPEAT);
    delete zoneTimers[action];
  }, DAS_DELAY);
}

function stopZone(action) {
  if (zoneTimers[action]) { clearTimeout(zoneTimers[action]); delete zoneTimers[action]; }
  if (zoneTimers[action + '_interval']) { clearInterval(zoneTimers[action + '_interval']); delete zoneTimers[action + '_interval']; }
  const el = document.getElementById(action === 'left' ? 'zone-left' : 'zone-right');
  if (el) el.classList.remove('active');
}

// Left zone
const zLeft = document.getElementById('zone-left');
zLeft.addEventListener('pointerdown', e => {
  e.preventDefault(); zLeft.setPointerCapture(e.pointerId);
  zLeft.classList.add('active'); startZone('left');
});
zLeft.addEventListener('pointerup', () => stopZone('left'));
zLeft.addEventListener('pointercancel', () => stopZone('left'));
zLeft.addEventListener('pointerleave', () => stopZone('left'));

// Right zone
const zRight = document.getElementById('zone-right');
zRight.addEventListener('pointerdown', e => {
  e.preventDefault(); zRight.setPointerCapture(e.pointerId);
  zRight.classList.add('active'); startZone('right');
});
zRight.addEventListener('pointerup', () => stopZone('right'));
zRight.addEventListener('pointercancel', () => stopZone('right'));
zRight.addEventListener('pointerleave', () => stopZone('right'));

// Mid zone — tap = rotate right, hold 300ms = rotate left
const zMid = document.getElementById('zone-mid');
let midDownT = 0, midHoldTimer = null;
zMid.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  if (state !== S.GAME || gameOver || gamePaused) return;
  zMid.setPointerCapture(e.pointerId);
  midDownT = Date.now();
  zMid.classList.add('active');

zMid.addEventListener('pointerup', () => {

document.addEventListener('keydown',e=>{
  initAudio();
  if (state===S.CHARSEL) {
    if (e.key==='ArrowLeft') { handleInput('left'); e.preventDefault(); }
    else if (e.key==='ArrowRight') { handleInput('right'); e.preventDefault(); }
    else if (e.key==='ArrowUp') { handleInput('up'); e.preventDefault(); }
    else if (e.key==='ArrowDown') { handleInput('down'); e.preventDefault(); }
    else if (e.key==='Enter'||e.key===' ') { handleInput('select'); e.preventDefault(); }
    return;
  }
  if (state===S.DIFF) {
    if (e.key==='ArrowLeft') { handleInput('left'); e.preventDefault(); }
    else if (e.key==='ArrowRight') { handleInput('right'); e.preventDefault(); }
    else if (e.key==='Enter'||e.key===' ') { handleInput('select'); e.preventDefault(); }
    return;
  }
  if (state===S.GAME) {
    if (e.key==='ArrowLeft') handleInput('left');
    else if (e.key==='ArrowRight') handleInput('right');
    else if (e.key==='ArrowDown') handleInput('down');
    else if (e.key==='ArrowUp') handleInput('harddrop');
    else if (e.key==='z'||e.key==='Z') handleInput('rotleft');
    else if (e.key==='x'||e.key==='X'||e.key===' ') handleInput('rotright');
    e.preventDefault(); return;
  }
  if (e.key==='Enter'||e.key===' ') handleInput('select');

canvas.addEventListener('pointerdown',e=>{

      arcadeOpponents=[0,1,2,3].filter(i=>i!==playerChar);

    const srvBtnX=arcBtnX;

      if (soundOn) { initAudio(); play('battle'); }

      return;
    }

// ============================================================
// STATE MACHINE
// ============================================================
function setState(s) {
  state=s;
  const ctrl=document.getElementById('controls');
  ctrl.classList.toggle('visible',s===S.GAME);
  if (s===S.TITLE) { resize(); play('title'); lastGameWasSurvival=false; }
  else if (s===S.CHARSEL) { resize(); selectedChar=playerChar; play('title'); lastGameWasSurvival=false; }
  else if (s===S.DIFF) { diffHighlight=0; }
  else if (s===S.VS) {
    vsTimer=2500; vsFlash=0; stopMusic();
    if (!arcadeMode) {
      const avail=[0,1,2,3].filter(i=>i!==playerChar);
      cpuChar=avail[Math.floor(Math.random()*avail.length)];
    }
    setTimeout(()=>play('battle'),600);
  }
  else if (s===S.GAME) {
    resize();
    if (survivalMode) { initSurvivalGame(); } else { lastGameWasSurvival=false; initGame(); }
  }
  else if (s===S.RESULT) {
    resultTimer=0; stopMusic();
    if (!survivalMode) saveScore(scores[0]);
    if (winner===0) { sfx('win'); spawnConfetti(canvas.width); vibrate([200,50,100]); } else { sfx('lose'); vibrate([300]); }
    setTimeout(()=>play('title'),900);
  }
  else if (s===S.ARCADE) {
    arcadeRoundTimer=0;
    cpuChar=arcadeOpponents[arcadeRound];
    difficulty=ARCADE_DIFF[Math.min(arcadeRound,3)];
    resize();
  }
  else if (s===S.ARCADE_END) {
    resultTimer=0;
    sfx('win');
    spawnConfetti(canvas.width);
    stopMusic();
    setTimeout(()=>play('title'),900);
  }
}

// ============================================================
// UPDATE
// ============================================================
function updateGame(dt) {
  if (gameOver||gamePaused) return;
  if(shakeTimer>0){shakeTimer-=dt*1000;if(shakeTimer<=0){shakeAmt=0;shakeTimer=0;}}
  updateParticlesFx(dt);
  gameTime+=dt;
  const ds=DIFF_SETTINGS[difficulty];

  // Tick chain display timers
  for (let bi=0;bi<2;bi++) if (chainDisplay[bi].timer>0) chainDisplay[bi].timer-=dt;

  // Update spawn flash timers
  for (let i=0;i<2;i++) if (spawnFlash[i]>0) spawnFlash[i]-=dt;

  // Update gem break animations
  for (let i=gemBreaks.length-1;i>=0;i--) {
    gemBreaks[i].timer -= dt / gemBreaks[i].maxTimer;
    if (gemBreaks[i].timer<=0) gemBreaks.splice(i,1);
  }
  // Tick ALL CLEAR display timers
  for (let bi=0;bi<2;bi++) if (allClearDisplay[bi].timer>0) allClearDisplay[bi].timer-=dt;

  if (survivalMode) {
    // Survival mode: track time, ramp gravity, auto-drop counter rows
    survivalTime+=dt;
    const srvSpeedLevel=Math.floor(survivalTime/20);
    const srvBase=DIFF_SETTINGS[1].gravity;
    fallDelay[0]=Math.max(150, srvBase-srvSpeedLevel*50);

    // Every 30 seconds, drop one row of counter gems
    const srvInterval=30;
    const prevIntervals=Math.floor((survivalTime-dt)/srvInterval);
    const curIntervals=Math.floor(survivalTime/srvInterval);
    if (curIntervals>prevIntervals && curIntervals>0) {
      addCounterGems(0, COLS);
    }

    // Only process board 0
    if (!pieces[0]) {
      if (!spawnPiece(0)) { endGame(0); return; }
    } else {
      const p=pieces[0];
      const canFallDown=isValid(boards[0],{...p,y:p.y+1});
      if (!canFallDown) {
        if (!lockDelayActive[0]) { lockDelayActive[0]=true; lockDelayTimer[0]=ds.lockDelay; }
        lockDelayTimer[0]-=dt*1000;
        if (lockDelayTimer[0]<=0) { lockPiece(0); if (!spawnPiece(0)) { endGame(0); return; } }
      } else {
        if (lockDelayActive[0]) { lockDelayActive[0]=false; lockMoveCount[0]=0; }
        fallTimers[0]+=dt*1000;
        fallProgress[0]=Math.min(1, fallTimers[0]/fallDelay[0]);
        if (fallTimers[0]>=fallDelay[0]) { fallTimers[0]=0; pieces[0].y++; fallProgress[0]=0; }
      }
    }
    return;
  }

  // AI timer uses difficulty's aiSpeed
  aiTimer-=dt*1000;
  if (aiTimer<=0) { aiTimer=ds.aiSpeed; doAI(); }

  // Difficulty ramp (gentle, starting from difficulty base)
  const rampBase0=ds.gravity;
  const rampBase1=Math.round(ds.gravity*0.85);
  if (gameTime>30) fallDelay[0]=Math.max(Math.round(rampBase0*0.3), rampBase0-(gameTime-30)*4);
  if (gameTime>20) fallDelay[1]=Math.max(Math.round(rampBase1*0.35), rampBase1-(gameTime-20)*4);

  for (let bi=0;bi<2;bi++) {
    if (!pieces[bi]) {
      if (!spawnPiece(bi)) { endGame(bi); return; }
      continue;
    }
    const p=pieces[bi];
    const canFallDown=isValid(boards[bi],{...p,y:p.y+1});

    if (!canFallDown) {
      // Lock delay logic
      if (!lockDelayActive[bi]) {
        lockDelayActive[bi]=true;
        lockDelayTimer[bi]=ds.lockDelay;
      }
      lockDelayTimer[bi]-=dt*1000;
      if (lockDelayTimer[bi]<=0) {
        lockPiece(bi);
        if (!spawnPiece(bi)) { endGame(bi); return; }
      }
    } else {
      // Piece can fall — cancel lock delay if it was active
      if (lockDelayActive[bi]) { lockDelayActive[bi]=false; lockMoveCount[bi]=0; }
      fallTimers[bi]+=dt*1000;
      fallProgress[bi]=Math.min(1, fallTimers[bi]/fallDelay[bi]);
      if (fallTimers[bi]>=fallDelay[bi]) {
        fallTimers[bi]=0;
        pieces[bi].y++;
        fallProgress[bi]=0;
      }
    }
  }
}

function initSurvivalGame() {
  const ds=DIFF_SETTINGS[1];
  boards=[makeBoard(),null];
  pieces=[null,null];
  queues=[new PieceQueue(playerChar),null];
  scores=[0,0]; attackBuffer=[0,0];
  fallTimers=[0,0]; fallDelay=[ds.gravity,0];
  fallProgress=[0,0];
  lockDelayTimer=[0,0]; lockDelayActive=[false,false]; lockMoveCount=[0,0];
  gameOver=false; gamePaused=false; gameTime=0; aiTimer=0; attackWarning=[0,0]; superMeter=[0,0];
  chainDisplay=[{chain:0,timer:0},{chain:0,timer:0}];
  allClearDisplay=[{timer:0},{timer:0}];
  spawnFlash=[0,0];
  gemBreaks.length=0;
  survivalTime=0; survivalGems=0; survivalScore=0;
  updateSuperBtn();
  spawnPiece(0);
}

// ============================================================
// MAIN LOOP
// ============================================================
let lastTime=0;

function loop(ts) {
  const dt=Math.min((ts-lastTime)/1000,0.05);
  lastTime=ts;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if (state===S.TITLE) { updateParticles(dt); drawTitle(dt); }
  else if (state===S.CHARSEL) drawCharSel(dt);
  else if (state===S.DIFF) drawDiff(dt);
  else if (state===S.VS) drawVS(dt);
  else if (state===S.GAME) { updateGame(dt); drawGame(dt); }
  else if (state===S.RESULT) drawResult(dt);
  else if (state===S.ARCADE) { arcadeRoundTimer+=dt; drawArcade(dt); if(arcadeRoundTimer>2.5) setState(S.VS); }
  else if (state===S.ARCADE_END) { updateParticles(dt); drawArcadeEnd(dt); }

  requestAnimationFrame(loop);
}

// ============================================================
// INIT
// ============================================================
window.addEventListener('resize',resize);
document.addEventListener('pointerdown',()=>initAudio(),{once:true});
document.addEventListener('keydown',()=>initAudio(),{once:true});

// Lock to portrait
try { screen.orientation && screen.orientation.lock && screen.orientation.lock('portrait').catch(()=>{}); } catch(e){}

resize();
initParticles();
setState(S.TITLE);

requestAnimationFrame(ts=>{ lastTime=ts; requestAnimationFrame(loop); });
</script>
</body>
</html>
